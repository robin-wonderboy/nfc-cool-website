faqTitle: "Часті питання"
faq:
  - question: "Чи безкоштовний NFC.cool?"
    answer: "Так. NFC.cool Tools і NFC.cool Business Card завантажуються безкоштовно. Зчитування NFC-міток, сканування QR-кодів і штрихкодів, сканування документів з розпізнаванням тексту, 3D-сканування та сканування приміщень безкоштовні. Необов'язкова підписка Platinum відкриває NFC Safe (секрети з шифруванням AES-256), розширене керування NFC (форматування, захист паролем, блокування, пакетні режими, запис із CSV, експертні команди, лічильник дотиків), потужні функції для QR (без водяних знаків, пакетне зчитування), експорт документів у PDF та автоекспорт в iCloud, обчислення площі в 3D, експорт моделей і фотографій, Швидкі команди iOS, віджети й Пункт керування, вебхуки, синтезатор мовлення, преміальні іконки та кольори застосунку, а ще роботу без реклами й пріоритетну підтримку."
  - question: "Які платформи підтримуються?"
    answer: "NFC.cool Tools працює на iPhone, iPad та Android. NFC.cool Business Card встановлюється окремо і працює на iPhone та Android. На iPad працюють усі функції з камерою (QR-коди, штрихкоди, документи, 3D-сканування та сканування приміщень), а от для читання й запису NFC потрібен iPhone, бо в iPad немає модуля NFC."
  - question: "З чого почати роботу з NFC.cool?"
    answer: "Завантаж NFC.cool Tools з App Store або Google Play і пройдися вкладками: NFC для читання й запису міток, QR для QR-кодів і штрихкодів, «Документ» для перетворення паперу на PDF, 3D для зйомки об'єктів і приміщень. Обліковий запис не потрібен, усе працює на самому пристрої."
  - question: "Як зчитати першу NFC-мітку?"
    answer: "Відкрий NFC.cool Tools, натисни «Зчитати NFC» і піднеси верхній край iPhone до мітки. NFC.cool одразу покаже розібраний вміст. Налаштовувати нічого не треба, достатньо встановити застосунок. На телефоні з Android можна спробувати просто зараз через <a href=\"/online-nfc-reader/\">NFC-зчитувач онлайн</a>, взагалі без встановлення."
  - question: "Як записати першу NFC-мітку?"
    answer: "Відкрий NFC.cool Tools, перейди на вкладку NFC і вибери «Записати NFC», познач тип запису (посилання, дані Wi-Fi, контакт, Швидка команда iOS та інші), введи дані й приклади верхній край iPhone до чистої мітки NTAG216 чи до будь-якої іншої з підтримкою NDEF. Тепер кожен дотик до цієї мітки запускає вибрану дію. Мітки з NDEF продаються в магазинах зі <a href=\"/affiliate-links/\">сторінки NFC-міток</a>."
  - question: "Чи працює NFC.cool без інтернету?"
    answer: "Так. Читання й запис NFC-міток, сканування QR-кодів і штрихкодів, розпізнавання тексту з документів, 3D-зйомка та сканування приміщень повністю відбуваються на пристрої. Інтернет потрібен лише необов'язковим хмарним функціям: вебхукам на твій сервер і синхронізації з iCloud."
  - question: "Які NFC-мітки підходять для NFC.cool?"
    answer: "Будь-яка мітка з підтримкою NDEF: NTAG213, NTAG215, NTAG216, MIFARE Ultralight, ICODE SLIX і більшість інших. Для загальних задач раджу NTAG216 завдяки її 888 байтам пам'яті та широкій сумісності з iPhone і Android. Перевірені магазини зібрані на <a href=\"/affiliate-links/\">сторінці NFC-міток</a>."
  - question: "Чи вміє NFC.cool сканувати QR-коди та штрихкоди?"
    answer: "Так, розпізнається 19 форматів з камери iPhone або з будь-якого фото в галереї: 6 двовимірних кодів (QR Code, Micro QR, Aztec, Data Matrix, PDF417, Micro PDF417) і 13 лінійних штрихкодів (EAN-13, EAN-8, UPC-E, Code 39 разом з Mod 43, Code 93, Code 128, Codabar, Interleaved 2 of 5, ITF-14, а також три варіанти GS1 DataBar). UPC-A зчитується як EAN-13 з нулем на початку. Пакетний режим тримає камеру відкритою, і це рятує на інвентаризації та реєстрації гостей."
  - question: "Чи можна записувати NFC-мітки з iPhone?"
    answer: "Так, кожен iPhone починаючи з iPhone 7 і читає, і записує NFC-мітки через NFC.cool Tools. На вибір понад 25 типів записів: посилання, дані Wi-Fi, контакти (vCard), Швидкі команди iOS, платежі, профілі в соцмережах та інші. Секрети спершу зашифруй у NFC Safe (AES-256), щоб дотик відмикав те, що треба."
  - question: "Чи підтримує NFC.cool Швидкі команди iOS і кнопку дії?"
    answer: "Так, на тарифі Platinum. NFC.cool Tools приносить App Intents, рідні дії для Швидких команд iOS, віджети на екрані блокування та на робочому столі, гачки для кнопки дії й швидкий запуск з Пункту керування. Сканування стає ланкою твоїх сценаріїв або спрацьовує однією кнопкою. Безкоштовний тариф покриває звичайний шлях «відсканував і поділився», а Швидкі команди, віджети й кнопка дії живуть у необов'язковій підписці Platinum."
  - question: "Як NFC.cool Business Card ділиться карткою без застосунку?"
    answer: "Через Apple AppClip (миттєвий обмін без завантаження, співрозмовник бачить картку в системному вікні), QR-код, картку в Apple Wallet або публічне посилання на вебпрофіль. Контакт зберігається в телефон одним дотиком, і для цього не треба ні встановлювати NFC.cool, ні заводити обліковий запис."
  - question: "Чим NFC.cool відрізняється від інших NFC-застосунків?"
    answer: "Більшість NFC-застосунків роблять щось одне: або читають, або пишуть. NFC.cool Tools уміє і те, і те, а разом з тим QR-коди, штрихкоди, розпізнавання документів, 3D-зйомку та сканування приміщень в одному застосунку. Є ще три відмінності. Приватність: дані сканування лишаються на пристрої й не йдуть на сервери NFC.cool. Глибока інтеграція з iOS (App Intents, Швидкі команди, віджети на екрані блокування, кнопка дії, вебхуки): сканування запускає твої сценарії, а не замикається всередині застосунку. І жива підтримка від одного розробника: він читає кожен лист особисто й випускає виправлення за кілька днів."

