faqTitle: "Sık sorulan sorular"
faq:
  - question: "NFC.cool ücretsiz mi?"
    answer: "Evet. NFC.cool Tools ve NFC.cool Business Card ücretsiz indirilir. NFC tag okuma, QR kod ve barkod tarama, OCR ile belge tarama, 3B ve oda tarama tamamen ücretsizdir. İsteğe bağlı Platinum aboneliği şunları açar: NFC Safe (256 bit AES ile şifrelenen gizli veriler), gelişmiş NFC denetimleri (biçimlendirme, parola koruma, kilitleme, toplu modlar, CSV'den yazma, uzman komutları, okutma sayacı), gelişmiş QR özellikleri (filigransız çıktı, toplu okuma), belgeleri PDF olarak ve iCloud'a otomatik dışa aktarma, 3B alan hesabı ile model ve fotoğraf dışa aktarımı, iOS Kısayolları, widget'lar ve Denetim Merkezi, webhook'lar, konuşma sentezleyici, özel uygulama simgeleri ve renkleri, ayrıca reklamsız kullanım ve öncelikli destek."
  - question: "Hangi platformlar destekleniyor?"
    answer: "NFC.cool Tools iPhone, iPad ve Android'de çalışır. NFC.cool Business Card ayrı bir uygulamadır, iPhone ve Android'de çalışır. iPad'de kameraya dayalı tüm özellikler (QR, barkod, belge, 3B, oda tarama) çalışır; NFC okuma ve yazma içinse iPhone gerekir, çünkü iPad'lerde NFC donanımı yoktur."
  - question: "NFC.cool'u kullanmaya nasıl başlarım?"
    answer: "NFC.cool Tools'u App Store'dan veya Google Play'den indir, sonra sekmeleri gez: tag okuyup yazmak için NFC, QR kodlar ve barkodlar için QR, kağıdı PDF'e çevirmek için Belge, nesne ve oda yakalamak için 3B. Hesap açmana gerek yok, her şey cihazda çalışır."
  - question: "İlk NFC tag'imi nasıl okuturum?"
    answer: "NFC.cool Tools'u aç, \"NFC Oku\"ya dokun ve iPhone'un üst kenarını NFC tag'e yaklaştır: NFC.cool tag'in içeriğini çözümlenmiş halde gösterir. Uygulamayı kurmak dışında hiçbir ayar gerekmez. Android telefonda hemen <a href=\"/online-nfc-reader/\">çevrimiçi NFC okuyucu</a> ile de deneyebilirsin, kurulum gerekmeden."
  - question: "İlk NFC tag'imi nasıl yazarım?"
    answer: "NFC.cool Tools'u aç, NFC sekmesine geç ve \"NFC Yaz\"ı seç, mesaj türünü belirle (URL, Wi-Fi bilgisi, kişi kartı, iOS kısayolu ve daha fazlası), verini gir, sonra iPhone'un üst kenarını boş bir NTAG216'ya (ya da NDEF uyumlu başka bir tag'e) yaklaştır. Artık o tag'e telefonunu yaklaştıran herkes senin seçtiğin eylemi tetikler. NDEF tag'leri <a href=\"/affiliate-links/\">NFC tag sayfasındaki</a> satıcıların herhangi birinden alabilirsin."
  - question: "NFC.cool çevrimdışı çalışır mı?"
    answer: "Evet. NFC tag okuma ve yazma, QR kod tarama, barkod tarama, belgelerde OCR, 3B ve oda yakalama tamamen cihazda çalışır. Yalnızca isteğe bağlı bulut özellikleri (kendi sunucuna giden webhook'lar, iCloud eşitleme) internete ihtiyaç duyar."
  - question: "NFC.cool hangi NFC tag'lerle çalışır?"
    answer: "NDEF uyumlu her NFC tag ile: NTAG213, NTAG215, NTAG216, MIFARE Ultralight, ICODE SLIX ve diğerlerinin çoğu. Genel kullanımda önerilen NTAG216, hem 888 baytlık kapasitesi hem de iPhone ile Android'de geniş uyumluluğu sayesinde. Denenmiş satıcıları <a href=\"/affiliate-links/\">NFC tag sayfasında</a> bulabilirsin."
  - question: "NFC.cool QR kod ve barkod tarar mı?"
    answer: "Evet, iPhone kamerasından ya da galerindeki herhangi bir fotoğraftan 19 kod biçimini tanır: 6 iki boyutlu kod (QR Code, Micro QR, Aztec, Data Matrix, PDF417, Micro PDF417) ve 13 doğrusal barkod (EAN-13, EAN-8, UPC-E, Code 39 ve Mod 43'lü hali, Code 93, Code 128, Codabar, Interleaved 2 of 5, ITF-14, üstüne üç GS1 DataBar türevi). UPC-A, başına sıfır eklenerek EAN-13 olarak okunur. Toplu mod kamerayı açık tutar, sayım ve etkinlik girişlerinde işe yarar."
  - question: "iPhone'umla NFC tag yazabilir miyim?"
    answer: "Evet, iPhone 7 ve sonrası her iPhone NFC.cool Tools ile tag okuyup yazabilir. 25'ten fazla mesaj türü var: URL, Wi-Fi bilgisi, kişi kartı (vCard), iOS kısayolu, ödeme, sosyal medya profili ve dahası. Okutunca açılan akışlar için gizli veriyi önce NFC Safe ile şifrele (256 bit AES)."
  - question: "NFC.cool, iOS Kısayolları'nı ve Aksiyon Düğmesi'ni destekliyor mu?"
    answer: "Evet, Platinum planında. NFC.cool Tools App Intents, yerel iOS Kısayolları eylemleri, kilit ekranı ve ana ekran widget'ları, Aksiyon Düğmesi bağlantıları ve Denetim Merkezi'nden hızlı açılış sunar: taramaları kendi otomasyonlarına bağla ya da tek düğmeyle çalıştır. Ücretsiz sürüm temel tara ve paylaş akışını kapsar; Kısayollar, widget'lar ve Aksiyon Düğmesi isteğe bağlı Platinum aboneliğinde."
  - question: "NFC.cool Business Card kartımı uygulama olmadan nasıl paylaşıyor?"
    answer: "Apple App Clip ile (hiçbir şey indirmeden anında paylaşım, karşı taraf kartını sistem penceresinde görür), QR kodla, Apple Wallet kartıyla ya da herkese açık web profili adresiyle. Kartı alan kişi tek dokunuşla kişiyi telefonuna kaydeder; NFC.cool kurmasına da hesap açmasına da gerek kalmaz."
  - question: "NFC.cool diğer NFC uygulamalarından nerede ayrılıyor?"
    answer: "NFC uygulamalarının çoğu ya okumaya ya yazmaya odaklanır; NFC.cool Tools ikisini birden yapar, üstüne QR kod, barkod, belgelerde OCR, 3B yakalama ve oda tarama tek uygulamada. Üç fark daha var: gizlilik, çünkü tarama verisi cihazda kalır ve NFC.cool sunucularına hiç gitmez; derin iOS entegrasyonu (App Intents, Kısayollar, kilit ekranı widget'ları, Aksiyon Düğmesi, webhook'lar), böylece taramalar uygulamanın içinde hapsolmak yerine senin otomasyonlarını tetikler; ve tek kişilik geliştirici desteği, yani her e-postayı bizzat okuyup düzeltmeleri günler içinde yayınlayan biri."

