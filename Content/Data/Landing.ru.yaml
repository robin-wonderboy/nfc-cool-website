faqTitle: "Частые вопросы"
faq:
  - question: "NFC.cool бесплатный?"
    answer: "Да. NFC.cool Tools и NFC.cool Business Card скачиваются бесплатно. Чтение NFC-меток, сканирование QR-кодов и штрихкодов, распознавание документов, 3D-съёмка и сканирование помещений тоже бесплатны. Подписка Platinum по желанию открывает NFC Safe (секреты с 256-битным шифрованием AES); продвинутую работу с метками (форматирование, пароль, блокировка, пакетные режимы, запись из CSV, экспертные команды, счётчик касаний); расширенные возможности QR (без водяных знаков, пакетное чтение); экспорт документов в PDF и автозагрузку в iCloud; расчёт площади, экспорт моделей и фотографий в 3D; быстрые команды iOS, виджеты и Пункт управления; вебхуки; синтезатор речи; премиальные иконки и цвета приложения; отсутствие рекламы и приоритетную поддержку."
  - question: "Какие платформы поддерживаются?"
    answer: "NFC.cool Tools работает на iPhone, iPad и Android. Отдельное приложение NFC.cool Business Card выходит на iPhone и Android. На iPad работают все функции с камерой (QR-коды, штрихкоды, документы, 3D, помещения), а вот чтение и запись NFC требуют iPhone: в iPad нет NFC-модуля."
  - question: "С чего начать работу с NFC.cool?"
    answer: "Скачай NFC.cool Tools в App Store или Google Play и загляни во вкладки: NFC для чтения и записи меток, QR для QR-кодов и штрихкодов, «Документ» для перевода бумаг в PDF, 3D для съёмки предметов и помещений. Аккаунт не нужен, всё работает прямо на устройстве."
  - question: "Как считать первую NFC-метку?"
    answer: "Открой NFC.cool Tools, нажми «Считать NFC» и поднеси верхний край iPhone к метке. NFC.cool сразу покажет разобранное содержимое. Настраивать ничего не нужно, достаточно установить приложение. На телефоне с Android можно попробовать прямо сейчас через <a href=\"/online-nfc-reader/\">NFC-считыватель онлайн</a>, вообще без установки."
  - question: "Как записать первую NFC-метку?"
    answer: "Открой NFC.cool Tools, перейди на вкладку NFC и выбери «Записать NFC», укажи тип записи (ссылка, данные Wi-Fi, контакт, быстрая команда iOS и другие), введи данные и приложи верхний край iPhone к чистой метке NTAG216 или к любой другой с поддержкой NDEF. Теперь любое касание этой метки запускает выбранное действие. Метки с NDEF продаются в магазинах со <a href=\"/affiliate-links/\">страницы NFC-меток</a>."
  - question: "NFC.cool работает без интернета?"
    answer: "Да. Чтение и запись NFC-меток, сканирование QR-кодов и штрихкодов, распознавание документов, 3D-съёмка и сканирование помещений полностью работают на устройстве. Интернет нужен только необязательным облачным функциям: вебхукам на твой сервер и синхронизации с iCloud."
  - question: "Какие NFC-метки подходят к NFC.cool?"
    answer: "Любые метки с поддержкой NDEF: NTAG213, NTAG215, NTAG216, MIFARE Ultralight, ICODE SLIX и большинство остальных. Для повседневных задач лучше всего брать NTAG216: 888 байт памяти и широкая совместимость с iPhone и Android. Проверенные магазины собраны на <a href=\"/affiliate-links/\">странице NFC-меток</a>."
  - question: "NFC.cool сканирует QR-коды и штрихкоды?"
    answer: "Да, приложение распознаёт 19 форматов с камеры iPhone или из любого снимка в галерее: 6 двумерных кодов (QR Code, Micro QR, Aztec, Data Matrix, PDF417, Micro PDF417) и 13 линейных штрихкодов (EAN-13, EAN-8, UPC-E, Code 39 вместе с Mod 43, Code 93, Code 128, Codabar, Interleaved 2 of 5, ITF-14 и три варианта GS1 DataBar). UPC-A читается как EAN-13 с ведущим нулём. Пакетный режим держит камеру открытой, что удобно для инвентаризации и регистрации на мероприятиях."
  - question: "Можно ли записывать NFC-метки с iPhone?"
    answer: "Да, любой iPhone начиная с iPhone 7 и считывает, и записывает метки через NFC.cool Tools. Доступно больше 25 типов записей: ссылки, данные Wi-Fi, контакты (vCard), быстрые команды iOS, платежи, профили в соцсетях и другое. Секреты можно сначала зашифровать в NFC Safe (256-битный AES) и открывать их касанием."
  - question: "Поддерживаются ли быстрые команды iOS и кнопка действия?"
    answer: "Да, на тарифе Platinum. В NFC.cool Tools есть App Intents, встроенные действия для быстрых команд, виджеты на экране блокировки и на рабочем столе, привязка к кнопке действия и быстрый запуск из Пункта управления: сканирование можно встроить в свои сценарии или запускать одной кнопкой. В бесплатной версии доступен базовый сценарий «отсканировал и поделился», а быстрые команды, виджеты и кнопка действия входят в подписку Platinum."
  - question: "Как визитка NFC.cool передаётся без установки приложения?"
    answer: "Через Apple App Clip (мгновенная передача без загрузки, получатель видит карточку в системном окне), QR-код, карту Apple Wallet или публичную ссылку на веб-профиль. Получатель сохраняет контакт одним касанием, и ему не нужно ни ставить NFC.cool, ни заводить аккаунт."
  - question: "Чем NFC.cool отличается от других NFC-приложений?"
    answer: "Большинство NFC-приложений делают что-то одно: либо читают, либо пишут. NFC.cool Tools умеет и то и другое, а вместе с этим QR-коды, штрихкоды, распознавание документов, 3D-съёмку и сканирование помещений в одном приложении. Есть и три других отличия. Приватность: данные сканирования остаются на устройстве и не уходят на серверы NFC.cool. Глубокая интеграция с iOS (App Intents, быстрые команды, виджеты на экране блокировки, кнопка действия, вебхуки): сканирование запускает твои сценарии, а не запирается внутри приложения. И живая поддержка от одного разработчика: он читает каждое письмо лично и выпускает исправления за несколько дней."

