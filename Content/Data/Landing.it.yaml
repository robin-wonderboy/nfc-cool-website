faqTitle: "Domande frequenti"
faq:
  - question: "NFC.cool è gratis?"
    answer: "Sì. NFC.cool Tools e NFC.cool Business Card si scaricano gratuitamente. Leggere i tag NFC, scansionare codici QR e codici a barre, digitalizzare documenti con l'OCR e catturare oggetti 3D e ambienti sono tutte funzioni gratuite. L'abbonamento Platinum, facoltativo, sblocca NFC Safe (dati riservati protetti con crittografia AES a 256 bit), i controlli NFC avanzati (formattazione, protezione con password, blocco, modalità in serie, scrittura da CSV, comandi per esperti, contatore degli avvicinamenti), le funzioni QR avanzate (nessuna filigrana, lettura in serie), l'esportazione dei documenti in PDF e su iCloud, il calcolo delle superfici e l'esportazione di modelli e foto in 3D, i Comandi Rapidi di iOS, i widget e Centro di Controllo, i webhook, la sintesi vocale, le icone e i colori esclusivi, oltre all'assenza di pubblicità e all'assistenza prioritaria."
  - question: "Quali piattaforme sono supportate?"
    answer: "NFC.cool Tools funziona su iPhone, iPad e Android. NFC.cool Business Card è un'app separata e funziona su iPhone e Android. Su iPad funzionano tutte le funzioni basate sulla fotocamera (QR, codici a barre, documenti, 3D, ambienti), mentre per leggere e scrivere i tag NFC serve un iPhone: gli iPad non hanno l'hardware NFC."
  - question: "Come inizio a usare NFC.cool?"
    answer: "Scarica NFC.cool Tools dall'App Store o da Google Play, poi esplora le schede: NFC per leggere e scrivere i tag, QR per codici QR e codici a barre, Documenti per trasformare la carta in PDF, 3D per catturare oggetti e ambienti. Non serve alcun account: tutto avviene sul dispositivo."
  - question: "Come scansiono il mio primo tag NFC?"
    answer: "Apri NFC.cool Tools, tocca \"Leggi NFC\" e avvicina il bordo superiore dell'iPhone al tag: NFC.cool mostra subito il contenuto del tag già interpretato. Non serve nessuna configurazione oltre all'installazione dell'app. Su un telefono Android puoi provarci anche subito con il <a href=\"/online-nfc-reader/\">lettore NFC online</a>, senza installare nulla."
  - question: "Come scrivo il mio primo tag NFC?"
    answer: "Apri NFC.cool Tools, passa alla scheda NFC e scegli \"Scrivi NFC\", seleziona un tipo di messaggio (URL, credenziali Wi-Fi, scheda contatto, Comandi Rapidi di iOS e altri ancora), inserisci i dati e avvicina il bordo superiore dell'iPhone a un NTAG216 vuoto (o a un altro tag compatibile con NDEF). Da quel momento, chiunque avvicini il telefono a quel tag avvia l'azione che hai scelto. Puoi acquistare tag NDEF da uno qualsiasi dei rivenditori elencati nella <a href=\"/affiliate-links/\">pagina dedicata ai tag NFC</a>."
  - question: "NFC.cool funziona senza connessione?"
    answer: "Sì. La lettura e la scrittura dei tag NFC, la scansione dei codici QR e dei codici a barre, l'OCR sui documenti e la cattura di oggetti 3D e ambienti avvengono interamente sul dispositivo. Solo le funzioni cloud facoltative (i webhook verso il tuo server, la sincronizzazione con iCloud) richiedono internet."
  - question: "Quali tag NFC funzionano con NFC.cool?"
    answer: "Qualsiasi tag NFC compatibile con NDEF: NTAG213, NTAG215, NTAG216, MIFARE Ultralight, ICODE SLIX e la maggior parte degli altri. Per l'uso generico il consiglio è l'NTAG216, grazie ai suoi 888 byte di capacità e all'ampia compatibilità con iPhone e Android. Nella <a href=\"/affiliate-links/\">pagina dedicata ai tag NFC</a> trovi i rivenditori che abbiamo provato."
  - question: "NFC.cool legge codici QR e codici a barre?"
    answer: "Sì, riconosce 19 formati dalla fotocamera dell'iPhone o da qualsiasi foto nella tua libreria: 6 codici bidimensionali (QR Code, Micro QR, Aztec, Data Matrix, PDF417, Micro PDF417) e 13 codici a barre lineari (EAN-13, EAN-8, UPC-E, Code 39 anche con Mod 43, Code 93, Code 128, Codabar, Interleaved 2 of 5, ITF-14 e le tre varianti GS1 DataBar). L'UPC-A viene letto come EAN-13 con uno zero iniziale. La modalità in serie tiene la fotocamera aperta, comoda per gli inventari e per gli ingressi agli eventi."
  - question: "Posso scrivere i tag NFC con l'iPhone?"
    answer: "Sì, ogni iPhone dall'iPhone 7 in poi può leggere e scrivere tag NFC con NFC.cool Tools. Puoi scegliere tra oltre 25 tipi di messaggio: URL, credenziali Wi-Fi, schede contatto (vCard), Comandi Rapidi di iOS, pagamenti, profili social e altro ancora. Per i flussi che si sbloccano con un avvicinamento, cifra prima i dati riservati con NFC Safe (AES a 256 bit)."
  - question: "NFC.cool supporta i Comandi Rapidi di iOS e il tasto Azione?"
    answer: "Sì, con il piano Platinum. NFC.cool Tools include App Intents, azioni native per i Comandi Rapidi di iOS, widget per la schermata di blocco e per quella Home, agganci per il tasto Azione e l'avvio rapido da Centro di Controllo: puoi concatenare le scansioni nelle tue automazioni oppure avviarle con un solo pulsante. La versione gratuita copre il flusso di base \"scansiona e condividi\", mentre Comandi Rapidi, widget e tasto Azione fanno parte dell'abbonamento Platinum facoltativo."
  - question: "Come fa NFC.cool Business Card a condividere il mio biglietto senza un'app?"
    answer: "Tramite App Clip di Apple (condivisione immediata senza scaricare nulla, chi lo riceve vede il biglietto in un riquadro di sistema), codice QR, pass di Apple Wallet oppure l'indirizzo di un profilo web pubblico. Chi riceve il biglietto salva il contatto sul telefono con un tocco, senza installare NFC.cool e senza creare un account."
  - question: "In cosa NFC.cool è diversa dalle altre app NFC?"
    answer: "Quasi tutte le app NFC si concentrano sulla lettura oppure sulla scrittura, mentre NFC.cool Tools fa entrambe le cose e aggiunge codici QR, codici a barre, OCR sui documenti, cattura 3D e scansione degli ambienti in una sola app. Ci sono poi altre tre differenze: la privacy, perché i dati delle scansioni restano sul dispositivo e non vengono mai inviati ai server di NFC.cool; l'integrazione profonda con iOS (App Intents, Comandi Rapidi, widget per la schermata di blocco, tasto Azione, webhook), così le scansioni avviano le tue automazioni invece di restare chiuse dentro l'app; e l'assistenza di uno sviluppatore indipendente, che legge personalmente ogni email e pubblica le correzioni nel giro di pochi giorni."

