faqTitle: "Domande frequenti"
faq:
  - question: "Serve il LiDAR?"
    answer: "Sì. RoomPlan è un'API di Apple che funziona solo con il LiDAR. (Anche lo scanner di oggetti 3D lo richiede: la sessione di Object Capture di Apple ne verifica la presenza.)"
  - question: "Quanto dura una scansione?"
    answer: "Basta attraversare la stanza. Il risultato si costruisce in tempo reale ed è già pronto quando finisci il giro."
  - question: "Posso aprire il risultato in un programma CAD?"
    answer: "Sì, l'USDZ è supportato dalla maggior parte dei programmi CAD e 3D moderni. Per lavorare con SketchUp o Revit, converti il file con Blender o con un convertitore gratuito da USD a OBJ."

