faqTitle: "Domande frequenti"
faq:
  - question: "Perché questa funzione è solo su iOS?"
    answer: "Per ora la versione Android di NFC.cool si concentra sull'NFC e sul biglietto da visita digitale. La lettura dei codici QR è già in programma anche per Android."
  - question: "I codici creati nello Studio funzionano con tutti i lettori?"
    answer: "Sì. Sono normali codici QR, con una veste grafica del tutto facoltativa. Qualunque lettore standard (la fotocamera di iOS, Google Lens, gli scanner di serie su Android) li decodifica senza problemi."
  - question: "Posso leggere un codice QR da uno screenshot?"
    answer: "Sì. Scegli un'immagine qualsiasi dalla libreria foto e NFC.cool individua tutti i codici QR presenti, anche quelli coperti in parte."
  - question: "Lo Studio aggiunge una filigrana o il marchio NFC.cool?"
    answer: "I codici creati con la versione gratuita portano una piccola dicitura. Con Platinum la filigrana sparisce e resta soltanto il tuo progetto."

