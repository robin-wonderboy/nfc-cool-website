faqTitle: "Domande frequenti"
faq:
  - question: "Serve un iPhone con LiDAR?"
    answer: "Sì. La sessione di Object Capture di Apple funziona solo su un dispositivo dotato di LiDAR, quindi iPhone Pro (12 Pro e successivi) oppure iPad Pro dal 2020 in poi. Gli iPhone non Pro non hanno il sensore LiDAR."
  - question: "Quanto dura una scansione?"
    answer: "Qualche minuto per girare intorno all'oggetto, poi un paio di minuti di ricostruzione sul dispositivo. Gli oggetti grandi o con superfici molto elaborate richiedono più tempo."
  - question: "Posso stampare in 3D il risultato?"
    answer: "Puoi esportare in OBJ e convertire il file in STL con Blender, MeshLab o qualsiasi altro programma di grafica 3D. La resa migliore si ottiene con oggetti di medie dimensioni e con una superficie ricca di dettagli."
  - question: "Che differenza c'è con lo scanner di ambienti?"
    answer: "Object Capture, cioè questa funzione, crea un unico modello 3D di un oggetto. Lo scanner di ambienti usa il LiDAR e RoomPlan di Apple per ricavare la pianta di uno spazio: pareti, porte, mobili. Entrambi richiedono il LiDAR, ma rispondono a domande diverse."

