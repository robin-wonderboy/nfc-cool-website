faqTitle: "Domande frequenti"
faq:
  - question: "L'OCR funziona senza connessione?"
    answer: "Sì. Vision di iOS si occupa dell'OCR interamente sul dispositivo. Puoi scansionare i documenti e riconoscerne il testo in aereo, in mezzo al bosco, ovunque."
  - question: "Quali lingue riconosce l'OCR?"
    answer: "Per ora Vision di iOS riconosce l'inglese, il francese, l'italiano, il tedesco, lo spagnolo, il portoghese e il cinese semplificato. In più riconosce la scrittura a mano."
  - question: "Quanto è preciso l'OCR?"
    answer: "Molto preciso sul testo stampato. Con la scrittura a mano dipende da quanto è ordinata e dal contrasto. In ogni caso il testo riconosciuto si può correggere dopo la scansione."
  - question: "Dove finiscono i documenti scansionati?"
    answer: "Nella versione gratuita restano nella memoria dell'app, sul dispositivo. Con Platinum puoi esportarli in automatico su Documenti di iCloud, così compaiono nell'app File e su ogni dispositivo collegato al tuo iCloud."

