faqTitle: "Sık sorulanlar"
faq:
  - question: "OCR çevrimdışı çalışır mı?"
    answer: "Evet. iOS Vision, OCR'ı tamamen cihazda yapar. Uçakta, dağ başında, nerede olursan ol tarayıp metne çevirebilirsin."
  - question: "OCR hangi dilleri destekliyor?"
    answer: "iOS Vision şu anda İngilizce, Fransızca, İtalyanca, Almanca, İspanyolca, Portekizce ve Basitleştirilmiş Çince tanıyor. Ayrıca el yazısı tanıma da destekleniyor."
  - question: "OCR ne kadar isabetli?"
    answer: "Basılı metinde çok yüksek. El yazısında isabet, yazının düzgünlüğüne ve kontrasta bağlı. Tanınan metni taramadan sonra düzenleyebilirsin."
  - question: "Taranan belgeler nerede saklanıyor?"
    answer: "Ücretsiz sürümde cihazdaki uygulama alanında. Platinum'da istersen iCloud Belgeler'e otomatik aktarılır, böylece Dosyalar uygulamasında ve iCloud hesabına bağlı her cihazda görünür."

