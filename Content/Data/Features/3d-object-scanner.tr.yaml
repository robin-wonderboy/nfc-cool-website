faqTitle: "Sık sorulanlar"
faq:
  - question: "iPhone'umda LiDAR olması şart mı?"
    answer: "Evet. Apple'ın Object Capture oturumu LiDAR'lı cihaz ister, yani iPhone Pro (12 Pro ve sonrası) ya da 2020 ve sonrasının iPad Pro'su. Pro olmayan iPhone'larda LiDAR yok."
  - question: "Bir tarama ne kadar sürer?"
    answer: "Nesnenin etrafında birkaç dakika dolaşmak, ardından cihazda birkaç dakikalık yeniden kurulum. Daha büyük ya da daha dokulu nesneler daha uzun sürer."
  - question: "Sonucu 3B yazıcıda basabilir miyim?"
    answer: "OBJ olarak dışa aktarıp Blender, MeshLab ya da herhangi bir standart 3B araçta STL'ye çevirebilirsin. Model kalitesi en çok orta boy, dokusu belirgin nesnelerde iyi sonuç verir."
  - question: "Bunun Oda Tarayıcı'dan farkı ne?"
    answer: "Object Capture (bu özellik) tek bir nesnenin 3B modelini kurar. Oda Tarayıcı ise LiDAR ile Apple'ın RoomPlan'ını kullanıp mekanın kat planını çıkarır: duvarlar, kapılar, mobilyalar. İkisi de LiDAR ister ama farklı sorulara yanıt verir."

