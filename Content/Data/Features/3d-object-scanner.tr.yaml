capabilitiesTitle: "Neler yapabilirsin"
capabilities:
  - title: "Fotogrametriyle yakalama"
    description: "Nesnenin etrafında dolaşıp onlarca fotoğraf çek. Apple'ın cihazda çalışan Object Capture hattı, gerçekçi geometriye sahip dokulu bir 3B model kurar."
  - title: "Önizle ve düzelt"
    description: "Modeli dışa aktarmadan önce 3B olarak incele. Kameranın ne gördüğünü merak edersen oturumda çekilen ham görsellere de bakabilirsin."
  - title: "AR Quick Look"
    description: "Taradığın nesneyi AR Quick Look ile oturma odana koy. USDZ dosyalarını arkadaşlarınla paylaş, onlar da doğrudan Mesajlar içinde görsün."
  - title: "Altı dışa aktarma biçimi"
    description: "AR Quick Look için dokulu USDZ, ya da Blender ve diğer 3B araçlar için düz geometri olarak USD, OBJ, STL, PLY veya ABC."

subsectionsTitle: "Elinden AR görünümüne"
subsections:
  - title: "Mesajlar'da AR Quick Look"
    body: "<p>USDZ, Apple'ın kendi AR biçimi. Taradığın nesneyi iMessage ya da AirDrop ile paylaş, karşındaki onu döndürsün, kendi odasına yerleştirsin, ekran görüntüsünü alsın. Hepsi mesaj önizlemesinden, uygulama kurmadan. Ürün önizlemeleri, heykel belgelemesi ya da sırf hava atmak için birebir.</p>"
    platforms: "iOS"

  - title: "Kısayollar ve App Intents"
    body: "<p>NFC.cool, hazır eylemleriyle doğrudan iOS Kısayollar uygulamasına bağlanır: son okunan NFC tag'ini al, tag'e mesaj yaz, tarayıcıyı aç ya da son okunan QR kodu getir. Bunları zincirleyip tag okuyan, içeriğini çözen ve sonrasında ne istersen onu başlatan kısayollar kur: otomasyon, kayıt tutma, günlük, aklına ne gelirse. Aynı eylemler iOS 17 ve sonrasındaki kilit ekranı <strong>Tarama Düğmesi</strong> denetimini de besler.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "NFC tag'ini otomasyon bloklarına bağlayan iPhone"
    platforms: "iOS"

  - title: "iPhone, iPad ve Mac arasında iCloud eşitleme"
    body: "<p>Taranan modeller iCloud Belgeler klasöründe durur, yani taradığın iPhone, gözden geçirdiğin iPad ve düzenleyeceğin <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a> aynı kitaplığı görür. Yolda çek, masada bitir.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "iPhone, iPad ve Mac arasında eşitlenen NFC.cool"
    platforms: "iOS"

