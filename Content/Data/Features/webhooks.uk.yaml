faqTitle: "Часті питання"
faq:
  - question: "Чи працює це на Android?"
    answer: "Так, вебхуки є і в iOS-версії NFC.cool Tools, і в Android-версії. Тіло JSON має однакову структуру на обох платформах. (Решта чотирьох автодій, тобто автозапуск Швидкої команди, озвучення, звук і відкриття посилань, працюють лише на iOS.)"
  - question: "Скільки адрес можна налаштувати?"
    answer: "Наразі одну. На неї приходять усі події сканування, а розрізняти їх допомагають увімкнені джерела й тип вмісту."
  - question: "Яка авторизація підтримується?"
    answer: "HTTP Basic auth: логін і пароль, які зберігаються зашифрованими в Keychain на iOS. Токени Bearer, власні заголовки й підпис HMAC поки не підтримуються."
  - question: "Що буде, якщо мій сервер лежить?"
    answer: "POST не пройде, а подія залишиться в журналі на пристрої. Автоматичної черги повторів поки немає, тож якщо сервер буває нестабільний, зроби обробник стійким до повторів і надішли подію ще раз з історії сканувань."
  - question: "Чи є обмеження на розмір вмісту?"
    answer: "З боку NFC.cool жорсткого обмеження немає. Сам вміст мітки обмежує стандарт NFC (кілька кілобайтів для звичайних міток NDEF)."
  - question: "Де подивитися, як це працює насправді?"
    answer: "Клонуй <a href=\"https://github.com/NickAtGit/nfc-cool-webhook-server\">вебсервер із GitHub</a>, запусти його локально, вкажи його адресу в застосунку, і кожне сканування прилітатиме просто на очах."

