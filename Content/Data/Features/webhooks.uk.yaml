capabilitiesTitle: "П'ять автодій"
capabilities:
  - title: "Вебхук (POST на твою адресу)"
    description: "HTTP POST зі структурованим тілом JSON тієї ж миті, коли сканування вдалося. Вкажи одну адресу, за потреби логін і пароль HTTP Basic, і на цьому все. iOS та Android."
  - title: "Швидка команда (iOS)"
    description: "Коли зчитане посилання має схему `shortcuts://`, потрібна Швидка команда iOS запускається сама, без зайвого натискання. Дані сканування підуть усюди, куди дістають Швидкі команди."
  - title: "Відкриття посилань (iOS)"
    description: "Якщо на мітці звичайне посилання, воно відкриється в Safari або у відповідному застосунку. Крок «натисни, щоб відкрити» просто зникає."
  - title: "Синтез мовлення (iOS)"
    description: "Прочитає зчитаний вміст уголос. Швидкість мовлення налаштовується. Корисно для доступності, для роботи із зайнятими руками або просто як приємне підтвердження."
  - title: "Звуковий сигнал (iOS)"
    description: "Підтверджує сканування звуком: або власним аудіофайлом, або одним із вбудованих тонів."

subsectionsTitle: "Як працює вебхук"
subsections:
  - title: "Що запускає вебхук: NFC, QR і штрихкоди"
    body: "<p>Вебхуки спрацьовують на трьох джерелах подій: <strong>зчитування NFC</strong>, <strong>сканування QR</strong> і <strong>сканування штрихкодів</strong>. У кожного джерела свій вимикач, тож зчитування NFC можна надсилати в систему обліку, а сканер камери не завалюватиме ту саму адресу. Сам вебхук при цьому один: одна адреса, одне тіло JSON, один POST.</p>"
    platforms: "iOS · Android"

  - title: "Що приходить у тілі запиту"
    body: "<p>Кожен POST надсилає тіло JSON такого вигляду:</p><pre><code>{\n  \"identifier\": \"04:A2:7F:1B:5E:80:00\",\n  \"date\": \"2026-05-12T14:23:01Z\",\n  \"content\": \"Filament Spool #1234\",\n  \"tagType\": \"openPrintTag\",\n  \"structured\": {\n    \"material\": \"PLA\",\n    \"color\": \"#FF6F4C\",\n    \"manufacturer\": \"Prusament\",\n    \"uuid\": \"5e8a-7c1d-4f90\"\n  }\n}</code></pre><p>Поля <code>tagType</code> і <code>structured</code> приходять тільки з особливими форматами на кшталт <a href=\"/features/nfc-reader-writer/\">OpenPrintTag</a>, а будь-яке інше сканування надсилає лише три перші поля. У <a href=\"/developers/\">довіднику для розробників</a> розібрано кожне поле, авторизацію, приклади curl і готові до запуску сервери.</p>"
    platforms: "iOS · Android"

  - title: "Приклад сервера на GitHub"
    body: "<p>Найшвидший спосіб побачити весь ланцюжок від початку до кінця: <a href=\"https://github.com/NickAtGit/nfc-cool-webhook-server\">вебсервер на GitHub</a>. Мінімальний приклад сервера, який приймає вміст вебхуків NFC.cool, записує його в журнал і показує структуру наживо. Клонуй, запусти, піднеси мітку до iPhone і дивись, як прилітають сканування.</p>"
    platforms: "iOS · Android"

specsTitle: "Технічні подробиці"
specs:
  - title: "Передавання"
    items:
      - "HTTPS бажаний, HTTP дозволений для розробки"
      - "POST із заголовком `Content-Type: application/json`"
      - "За потреби HTTP Basic auth (логін і пароль)"
      - "Дані для входу зберігаються зашифрованими в Keychain на iOS"
  - title: "Тіло запиту"
    items:
      - "`identifier`: UID мітки або зчитаний код"
      - "`date`: позначка часу за ISO 8601"
      - "`content`: розібраний вміст (посилання, текст тощо)"
      - "`tagType`: приходить зі структурованими мітками (наприклад, `openPrintTag`)"
      - "`structured`: вкладений JSON для структурованих типів міток"
  - title: "Джерела"
    items:
      - "Зчитування NFC (записи NDEF)"
      - "Сканування QR"
      - "Сканування штрихкодів"
      - "Кожне джерело вмикається окремо"

