faqTitle: "Sık sorulanlar"
faq:
  - question: "Bu Android'de çalışıyor mu?"
    answer: "Evet, webhook'lar NFC.cool Tools'un hem iOS hem Android sürümünde var. JSON yükünün biçimi iki platformda da aynı. (Diğer dört kanca (otomatik kısayol, konuşma, ses ve bağlantı açma) yalnızca iOS'ta.)"
  - question: "Kaç adres tanımlayabilirim?"
    answer: "Bugün için tek adres. Tüm tarama olayları aynı adrese gider; hangi kaynağın açık olduğuna ve yükün türüne göre ayırt edilir."
  - question: "Hangi kimlik doğrulama destekleniyor?"
    answer: "HTTP Basic: kullanıcı adı ve parola, iOS Anahtar Zinciri'nde şifreli saklanır. Bearer token, özel başlıklar ve HMAC imzalama şimdilik desteklenmiyor."
  - question: "Sunucum kapalıysa ne olur?"
    answer: "POST başarısız olur ve olay cihazda kaydedilir. Bugün otomatik yeniden deneme kuyruğu yok; sunucun kesintiye uğrayabiliyorsa işleyicini tekrar çağrılmaya dayanıklı yaz ve tarama geçmişinden yeniden tetikle."
  - question: "Yük boyutu sınırı var mı?"
    answer: "NFC.cool tarafında katı bir sınır yok. Tag içeriklerinin kendisi NFC standardıyla sınırlı (tipik NDEF tag'lerde birkaç KB)."
  - question: "Gerçekten çalışırken nerede görebilirim?"
    answer: "<a href=\"https://github.com/NickAtGit/nfc-cool-webhook-server\">GitHub'daki web sunucusunu</a> klonla, yerelde çalıştır, uygulamayı ona yönlendir; her taramanın anında geldiğini göreceksin."

