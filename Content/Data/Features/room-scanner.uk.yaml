  title: "Сканер приміщень"
  description: "Пройдися кімнатою, і RoomPlan збудує чистий план: стіни, двері, вікна й меблі, разом із розмірами приміщення та обчисленою площею."
  imagePath: "/assets/images/Webflow/scan-room.webp"
  platforms: "iOS only"

hero:
  title: "Сканер приміщень"
  subtitle: "RoomPlan на базі LiDAR перетворює прогулянку простором на чистий параметричний план: стіни, двері, вікна й упізнані меблі, зібрані в одну сцену USDZ."
  platforms: "iOS only"
  heroImagePath: "/assets/images/Webflow/scan-room.webp"

capabilitiesTitle: "Що вміє застосунок"
capabilities:
  - title: "Зйомка через RoomPlan"
    description: "Пройдися кімнатою з LiDAR в iPhone. NFC.cool будує параметричну модель у реальному часі: стіни, двері, вікна й отвори."
  - title: "Упізнані меблі"
    description: "Ліжка, дивани, столи, стільці, шафи, плити, раковини, унітази, ванни й телевізори розпізнаються та підписуються прямо в сцені."
  - title: "Площа й розміри"
    description: "Для кожної кімнати рахується площа підлоги, висота стелі й розміри кожної стіни. Прочитай їх на моделі або вклади в експортований USDZ."
  - title: "AR Quick Look"
    description: "Відкрий готову кімнату в AR Quick Look або поділися файлом USDZ: одержувач обійде модель просто в Повідомленнях."

subsectionsTitle: "Від прогулянки до робочого плану"
subsections:
  - title: "Постав кімнату в доповнену реальність"
    body: "<p>Щойно сканування завершено, відкрий його в AR Quick Look і фізично обійди цифрового двійника. Зручно перевірити розстановку меблів ще до покупки або відчути масштаб, якого кресленню на планшеті не передати.</p>"
    imagePath: "/assets/images/Blog/mac-3d-detail.webp"
    imageAlt: "Детальний перегляд сканування кімнати"
    platforms: "iOS"

  - title: "Кілька кімнат поспіль"
    body: "<p>Одне сканування дає одну кімнату. Зніми кухню, зніми вітальню, зніми спальні: вони лежать поруч у бібліотеці, а 3D-редактор на твій смак зшиє їх в одну сцену USDZ. Особливо доречно для оголошень про нерухомість, планування ремонту чи страхової документації.</p>"
    platforms: "iOS"

  - title: "Швидкі команди й App Intents"
    body: "<p>NFC.cool вбудовується просто у Швидкі команди iOS і приносить готові дії: взяти останню зчитану NFC-мітку, записати повідомлення на мітку, відкрити сканер або дістати останній відсканований QR-код. Збери з них команду, яка зчитує мітку, розбирає її вміст і запускає далі що завгодно: автоматизацію, журнал, щоденник. Ті самі дії живлять кнопку <strong>Сканувати</strong> на екрані блокування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone зв'язує NFC-мітку з блоками автоматизації"
    platforms: "iOS"

  - title: "Синхронізація через iCloud між iPhone, iPad і Mac"
    body: "<p>Відскановані кімнати лежать у теці «Документи» в iCloud, тож iPhone, яким ти знімав, iPad, на якому переглядав, і <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>, на якому редагуватимеш, бачать одну бібліотеку. Пройди простір один раз, а план допрацюй потім за столом.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронізується між iPhone, iPad і Mac"
    platforms: "iOS"

specsTitle: "Обладнання і результат"
specs:
