    items:
      - "iPhone з LiDAR (12 Pro і новіші моделі Pro)"
      - "iPad Pro 2020 року й новіші теж підходять"
      - "RoomPlan доступний з iOS 16, а найсвіжіші поліпшення приходять на iOS 17 і новіші"
  - title: "Результат"
    items:
      - "Сцена USDZ з іменованими об'єктами"
      - "Стіни, двері, вікна, отвори"
      - "Упізнані категорії меблів"
      - "Площа підлоги й розміри"

