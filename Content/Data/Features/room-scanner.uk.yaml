faqTitle: "Часті питання"
faq:
  - question: "Чи потрібен LiDAR?"
    answer: "Так. RoomPlan від Apple працює тільки з LiDAR. (3D-сканеру об'єктів він теж потрібен, бо без нього сеанс Object Capture не запуститься.)"
  - question: "Скільки триває сканування?"
    answer: "Просто пройдися кімнатою. Результат збирається наживо й готовий тієї миті, коли ти закінчиш."
  - question: "Чи відкриється результат у CAD?"
    answer: "Так, USDZ розуміє більшість сучасних CAD- і 3D-інструментів. Для SketchUp чи Revit переведи файл через Blender або будь-який безкоштовний конвертер USD у OBJ."

