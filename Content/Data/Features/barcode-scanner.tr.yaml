faqTitle: "Sık sorulanlar"
faq:
  - question: "Bu neden yalnızca iOS'ta var?"
    answer: "NFC.cool'un Android sürümü şimdilik NFC'ye ve dijital kartvizite odaklanıyor. Barkod tarama Android yol haritasında."
  - question: "Aynı anda birden çok barkod tarayabilir miyim?"
    answer: "Evet, toplu mod kamerayı açık tutar ve bulduğu her barkodu sıraya alır. Sıradaki herhangi bir kayda dokunup üzerinde işlem yapabilirsin."
  - question: "Taramalarımı kaydedip paylaşabilir miyim?"
    answer: "Evet, her tarama zaman damgasıyla geçmiş görünümünde kalır. Bir taramayı favorileyebilir, başlık verebilir ve oradan paylaşabilirsin."
  - question: "Tarayıcı çevrimdışı çalışır mı?"
    answer: "Taramanın kendisi için evet. Ürün araması internet ister (barkod numarasını arama motorunda çalıştırır), ama barkodun okunması yalnızca cihazda olur."

