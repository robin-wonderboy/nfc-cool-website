capabilitiesTitle: "Neler yapabilirsin"
capabilities:
  - title: "Başlıca tüm barkod biçimleri"
    description: "EAN-13/8, UPC-E (UPC-A, EAN-13 olarak okunur), Code 128, Code 39 (Mod 43 dahil), Code 93, ITF, ITF-14, Codabar, GS1 DataBar, PDF417, Aztec, Data Matrix ve dahası. Biçim kendiliğinden algılanır, mod değiştirmek yok."
  - title: "Toplu mod"
    description: "Bir yığın barkodu yeniden nişan almadan arka arkaya tara. Sayımlarda, etkinlik girişlerinde ya da kütüphane arşivlerinde işe yarar."
  - title: "Ürün araması"
    description: "Okuttuğun perakende barkoduna dokun ve arat: barkod numarası önceden seçtiğin arama motorunda (Google, Ecosia, DuckDuckGo, Bing ya da Startpage) çalışır, sonuçlar doğrudan karşına gelir."
  - title: "Tarama geçmişi ve paylaşım"
    description: "Her tarama zaman damgasıyla saklanır. Önemli olanları favorile, birine kendi başlığını ver, geçmiş görünümünden doğrudan paylaş."
  - title: "Okuyunca otomatik çalışsın"
    description: "Adresler ve kısayol kodları tarandığı anda kendiliğinden açılabilir, webhook tetikleyebilir ya da sesli okunabilir. NFC ve QR'ı da besleyen aynı beş kancalı otomasyon."

subsectionsTitle: "Yüksek hacimli tarama için"
subsections:
  - title: "Çoklu tarama, toplu okuma ve istediğinde fener"
    body: "<p>Üç ayar tarayıcıyı tek seferlik olmaktan çıkarıp sürekli bir akışa çevirir. <strong>Çoklu tarama</strong> tek kamera oturumunda birden çok kod okutmanı sağlar. <strong>Toplu okuma</strong> sayım ya da etkinlik girişleri için kamerayı açık tutar. <strong>Otomatik fener</strong> ise loş ışıkta LED'i yakar, el feneri düğmesini aramakla uğraşmazsın.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "Fener ışığıyla birden çok QR kod ve barkod tarayan iPhone"
    platforms: "iOS"

  - title: "Sayım ve etkinlik girişleri için webhook'lar"
    body: "<p>Barkod tarayıcıyı kendi arka ofis sistemine doğrult. Okunan her barkod senin adresine webhook gönderir, böylece kamera ilerledikçe stok veritabanın, katılımcı sistemin ya da kütüphane kataloğun anlık güncellenir. JSON yükünün biçimi ve örnek sunucu için <a href=\"/features/webhooks/\">Webhook ve Otomasyon</a> sayfasına bak.</p>"
    platforms: "iOS"

  - title: "Kısayollar ve App Intents"
    body: "<p>NFC.cool, hazır eylemleriyle doğrudan iOS Kısayollar uygulamasına bağlanır: son okunan NFC tag'ini al, tag'e mesaj yaz, tarayıcıyı aç ya da son okunan QR kodu getir. Bunları zincirleyip tag okuyan, içeriğini çözen ve sonrasında ne istersen onu başlatan kısayollar kur: otomasyon, kayıt tutma, günlük, aklına ne gelirse. Aynı eylemler iOS 17 ve sonrasındaki kilit ekranı <strong>Tarama Düğmesi</strong> denetimini de besler.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "NFC tag'ini otomasyon bloklarına bağlayan iPhone"
    platforms: "iOS"

  - title: "iPhone, iPad ve Mac arasında iCloud eşitleme"
    body: "<p>Barkod tarama geçmişin iCloud hesabındaki her cihaz arasında eşitlenir. Raf dolusu ürünü iPhone'la tara, listeyi iPad'de gözden geçir, taramalara <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac'te</a> başlık verip paylaş: tek bir eşitlenmiş geçmiş, elle taşınacak hiçbir şey yok.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "iPhone, iPad ve Mac arasında eşitlenen NFC.cool"
    platforms: "iOS"

