faqTitle: "Частые вопросы"
faq:
  - question: "Распознавание работает без интернета?"
    answer: "Да. iOS Vision распознаёт текст полностью на устройстве. Сканировать и распознавать документы можно в самолёте, в лесу, где угодно."
  - question: "Какие языки поддерживает распознавание?"
    answer: "Сейчас iOS Vision распознаёт английский, французский, итальянский, немецкий, испанский, португальский и упрощённый китайский. Вдобавок поддерживается рукописный текст."
  - question: "Насколько точно распознавание?"
    answer: "Для печатного текста очень точно. Точность на рукописном зависит от почерка и контраста. Любой распознанный текст можно поправить после сканирования."
  - question: "Где хранятся отсканированные документы?"
    answer: "В бесплатной версии в песочнице приложения на устройстве. В Platinum их можно автоматически выгружать в «Документы» iCloud, и тогда они появятся в приложении «Файлы» и на всех устройствах с твоей учётной записью iCloud."

