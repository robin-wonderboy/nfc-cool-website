card:
  title: "Сканер документов с распознаванием текста"
  description: "Сканируй документы на iPhone или iPad: границы находятся сами, текст распознаётся прямо на устройстве, наружу ничего не уходит. На выходе многостраничный PDF с поиском по тексту."
  imagePath: "/assets/images/Webflow/document-scan.webp"
  platforms: "Только iOS"

hero:
  title: "Сканер документов с распознаванием текста"
  subtitle: "Снимай документы с автоматическим поиском границ и выравниванием перспективы. Распознавание идёт на устройстве, поэтому текст остаётся с тобой и никуда не уходит."
  platforms: "Только iOS"
  heroImagePath: "/assets/images/Webflow/document-scan.webp"

capabilitiesTitle: "Что можно делать"
capabilities:
  - title: "Находить границы автоматически"
    description: "Наведи камеру на лист, и NFC.cool сам найдёт углы и сделает снимок. За один сеанс можно отснять целую стопку страниц."
  - title: "Выравнивать перспективу"
    description: "Снял под углом? NFC.cool выпрямит страницу в аккуратный прямоугольник, уберёт тени и добавит контраста, чтобы получилось как с планшетного сканера."
  - title: "Распознавать текст на устройстве"
    description: "Распознавание идёт локально на iPhone: ни документ, ни текст не покидают устройство. Текст каждой страницы хранится рядом со снимком, и по нему работает поиск внутри приложения."
  - title: "Выгружать PDF с текстовым слоем"
    description: "Собери многостраничный PDF с вшитым слоем распознанного текста, чтобы каждое слово выделялось, копировалось и искалось в любой программе для чтения PDF."
  - title: "Быстро отправлять и сохранять"
    description: "Отправляй почтой, сообщением или по AirDrop либо сохраняй в «Файлы». Без водяных знаков, без регистрации, без логотипа NFC.cool."

subsectionsTitle: "Умнее, чем скриншот"
subsections:
  - title: "Многостраничные сканы и название само"
    body: "<p>Документ не всегда помещается на одну страницу. NFC.cool держит камеру открытой между снимками, позволяет менять порядок страниц, выкидывать неудачные и собирает всё в один документ. Встроенная подсказка названий читает первую страницу и предлагает осмысленное имя файла, так что переименовывать вручную каждый раз не придётся.</p>"
    imagePath: "/assets/images/Webflow/document-scan-detail.webp"
    imageAlt: "Подробный вид многостраничного документа"
    platforms: "iOS"

  - title: "Импорт из галереи"
    body: "<p>Уже сфотографировал чек обычной камерой? Выбери снимок или сразу несколько из галереи: NFC.cool применит к импортированным фотографиям то же определение границ, выравнивание перспективы и распознавание текста, что и к свежим снимкам. Удобно, чтобы задним числом разобрать месяцы разрозненных фотографий.</p>"
    platforms: "iOS"

  - title: "Сжатие под твой контроль"
    body: "<p>PDF с телефона легко раздувается, если не следить. NFC.cool выносит степень сжатия в настройки, поэтому можно выбирать между архивным качеством и размером, который не стыдно отправить почтой, и не пересканировать заново.</p>"
    platforms: "iOS"

  - title: "Быстрые команды и App Intents"
    body: "<p>NFC.cool встраивается прямо в приложение «Быстрые команды» готовыми действиями: взять последнюю считанную NFC-метку, записать сообщение на метку, открыть сканер или взять последний считанный QR-код. Из них собираются сценарии, которые считывают метку, разбирают её содержимое и запускают что угодно дальше: автоматизацию, журнал, дневник, всё что придумаешь. Те же действия питают элемент <strong>«Кнопка сканирования»</strong> на экране блокировки в iOS 17 и новее.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone связывает NFC-метку с блоками автоматизации"
    platforms: "iOS"

  - title: "Синхронизация с iCloud между iPhone, iPad и Mac"
    body: "<p>Документы синхронизируются через iCloud между всеми устройствами твоей учётной записи. Отсканируй договор на iPhone, перечитай на iPad, подпиши на <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>: одна библиотека, без экспорта туда-обратно. Вместе с документом едут и исходные снимки, и распознанный текст.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронизируется между iPhone, iPad и Mac"
    platforms: "iOS"

