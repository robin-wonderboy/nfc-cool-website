  description: "Скануй 13 форматів штрихкодів і ще 6 двовимірних кодів: EAN, UPC, QR, PDF417, Data Matrix та інші. Пакетний режим тримає камеру відкритою для перерахунку залишків і реєстрації гостей."
  imagePath: "/assets/images/Webflow/qr-barcode.webp"
