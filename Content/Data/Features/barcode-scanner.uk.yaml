capabilitiesTitle: "Що вміє застосунок"
capabilities:
  - title: "Усі поширені формати штрихкодів"
    description: "Скануй EAN-13/8, UPC-E (UPC-A читається як EAN-13), Code 128, Code 39 (разом з Mod 43), Code 93, ITF, ITF-14, Codabar, GS1 DataBar, PDF417, Aztec, Data Matrix та інші. Формат визначається сам, режими перемикати не треба."
  - title: "Пакетний режим"
    description: "Скануй стос штрихкодів підряд, не наводячи камеру щоразу заново. Стане в пригоді на перерахунку залишків, на реєстрації гостей чи в бібліотечному архіві."
  - title: "Пошук товару"
    description: "Натисни на відсканований торговий штрихкод, щоб знайти сам товар: номер коду йде в заздалегідь вибрану пошукову систему (Google, Ecosia, DuckDuckGo, Bing або Startpage), а результати повертаються одразу."
  - title: "Історія сканувань і обмін"
    description: "Кожне сканування зберігається разом із часом. Познач важливі зірочкою, дай окремому скануванню власну назву й поділися ним прямо з історії."
  - title: "Автодія після сканування"
    description: "Посилання й коди Швидких команд відкриваються одразу після сканування, надсилають вебхук або звучать уголос. Та сама автоматика з п'яти автодій, що й на NFC та QR."

subsectionsTitle: "Створено для великих обсягів"
subsections:
  - title: "Мультисканування, пакетне читання і ліхтарик за потреби"
    body: "<p>Три налаштування перетворюють сканер з одноразового на безперервний. <strong>Мультисканування</strong> дає відсканувати кілька кодів за один сеанс камери. <strong>Пакетне читання</strong> тримає камеру відкритою для перерахунку залишків чи реєстрації гостей. <strong>Автоліхтарик</strong> вмикає світлодіод у темряві, щоб не шукати кнопку ліхтарика наосліп.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone сканує кілька QR-кодів і штрихкодів при світлі ліхтарика"
    platforms: "iOS"

  - title: "Вебхуки для інвентаризації та реєстрації гостей"
    body: "<p>Приєднай сканер штрихкодів до своєї внутрішньої системи. Кожен відсканований штрихкод шле вебхук на твою адресу, тож база залишків, CRM з учасниками чи каталог бібліотеки оновлюються в реальному часі, поки камера рухається далі. Форму тіла JSON і приклад сервера шукай на сторінці <a href=\"/features/webhooks/\">Вебхуки й автоматизація</a>.</p>"
    platforms: "iOS"

  - title: "Швидкі команди й App Intents"
    body: "<p>NFC.cool вбудовується просто у Швидкі команди iOS і приносить готові дії: взяти останню зчитану NFC-мітку, записати повідомлення на мітку, відкрити сканер або дістати останній відсканований QR-код. Збери з них команду, яка зчитує мітку, розбирає її вміст і запускає далі що завгодно: автоматизацію, журнал, щоденник. Ті самі дії живлять кнопку <strong>Сканувати</strong> на екрані блокування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone зв'язує NFC-мітку з блоками автоматизації"
    platforms: "iOS"

  - title: "Синхронізація через iCloud між iPhone, iPad і Mac"
    body: "<p>Історія сканувань штрихкодів розходиться на всі пристрої з твоїм обліковим записом iCloud. Відскануй цілу полицю товарів з iPhone, перевір список на iPad, а на <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a> дай сканам назви й поділися ними: одна спільна історія, нічого не треба переносити руками.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронізується між iPhone, iPad і Mac"
    platforms: "iOS"

specsTitle: "Підтримані формати (усього 19)"
specs:
  - title: "Лінійні штрихкоди (13 форматів)"
    items:
      - "EAN-13, EAN-8"
      - "UPC-E (UPC-A читається як EAN-13)"
      - "Code 39, Code 39 Mod 43"
      - "Code 93, Code 128"
      - "Codabar"
      - "Interleaved 2 of 5, ITF-14"
      - "GS1 DataBar (звичайний, Expanded, Limited)"
  - title: "Двовимірні й складені коди (6 форматів)"
    items:
      - "QR Code"
      - "Micro QR"
      - "PDF417"
      - "Micro PDF417"
      - "Aztec"
      - "Data Matrix"

