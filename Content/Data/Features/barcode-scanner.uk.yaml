hero:
  title: "Сканер штрихкодів"
  subtitle: "Скануй 19 форматів кодів: 13 лінійних штрихкодів (EAN, UPC, Code 128, GS1 DataBar та інші) і 6 двовимірних (QR, PDF417, Aztec, Data Matrix та варіанти Micro). Пакетний режим тримає камеру відкритою для перерахунку залишків і реєстрації гостей."
