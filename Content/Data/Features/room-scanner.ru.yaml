faqTitle: "Частые вопросы"
faq:
  - question: "Нужен ли LiDAR?"
    answer: "Да. Apple сделала RoomPlan как API, который работает только с LiDAR. (3D-сканеру объектов датчик тоже нужен: сеанс Object Capture проверяет его наличие.)"
  - question: "Сколько длится сканирование?"
    answer: "Просто пройди по комнате. Результат строится на ходу и готов, как только ты закончишь."
  - question: "Можно ли открыть результат в CAD-программе?"
    answer: "Да, USDZ понимают большинство современных CAD и 3D-редакторов. Для SketchUp и Revit переведи файл через Blender или любой бесплатный конвертер USD в OBJ."

