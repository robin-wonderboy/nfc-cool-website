card:
  title: "Сканер помещений"
  description: "Пройди по комнате, и RoomPlan построит аккуратный план: стены, двери, окна и мебель, вместе с размерами комнаты и расчётом площади."
  imagePath: "/assets/images/Webflow/scan-room.webp"
  platforms: "Только iOS"

hero:
  title: "Сканер помещений"
  subtitle: "RoomPlan на базе LiDAR превращает прогулку по комнате в аккуратный параметрический план: стены, двери, окна и распознанная мебель, всё это выгружается одной сценой USDZ."
  platforms: "Только iOS"
  heroImagePath: "/assets/images/Webflow/scan-room.webp"

capabilitiesTitle: "Что можно делать"
capabilities:
  - title: "Снимать через RoomPlan"
    description: "Пройди по комнате с датчиком LiDAR в iPhone. NFC.cool строит параметрическую модель в реальном времени: стены, двери, окна и проёмы."
  - title: "Распознавать мебель"
    description: "Кровати, диваны, столы, стулья, шкафы, плиты, раковины, унитазы, ванны и телевизоры определяются и подписываются прямо в сцене."
  - title: "Считать площадь и размеры"
    description: "Для каждой комнаты видны площадь пола, высота потолка и размеры каждой стены. Их можно прочитать с модели или вшить в выгруженный USDZ."
  - title: "Открывать в AR Quick Look"
    description: "Открой готовую комнату в AR Quick Look или отправь USDZ: получатель обойдёт модель прямо в «Сообщениях»."

subsectionsTitle: "От прогулки по комнате до рабочего плана"
subsections:
  - title: "Комната в дополненной реальности"
    body: "<p>Когда сканирование закончено, открой его в AR Quick Look и обойди цифрового двойника ногами. Удобно, чтобы на трезвую голову проверить расстановку мебели до покупки или почувствовать масштаб, который чертёж на планшете передать не может.</p>"
    imagePath: "/assets/images/Blog/mac-3d-detail.webp"
    imageAlt: "Подробный вид отсканированной комнаты"
    platforms: "iOS"

  - title: "Работа с несколькими комнатами"
    body: "<p>Одно сканирование даёт одну комнату. Сними кухню, потом гостиную, потом спальни: они лягут в библиотеку рядом друг с другом, а любой 3D-редактор соберёт из них общий USDZ. Особенно полезно для объявлений о продаже жилья, планирования ремонта и страховых описей.</p>"
    platforms: "iOS"

  - title: "Быстрые команды и App Intents"
    body: "<p>NFC.cool встраивается прямо в приложение «Быстрые команды» готовыми действиями: взять последнюю считанную NFC-метку, записать сообщение на метку, открыть сканер или взять последний считанный QR-код. Из них собираются сценарии, которые считывают метку, разбирают её содержимое и запускают что угодно дальше: автоматизацию, журнал, дневник, всё что придумаешь. Те же действия питают элемент <strong>«Кнопка сканирования»</strong> на экране блокировки в iOS 17 и новее.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone связывает NFC-метку с блоками автоматизации"
    platforms: "iOS"

  - title: "Синхронизация с iCloud между iPhone, iPad и Mac"
    body: "<p>Отсканированные комнаты лежат в папке «Документы» в iCloud, поэтому iPhone, которым ты снимал, iPad, на котором смотрел, и <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>, на котором будешь править, видят одну и ту же библиотеку. Пройди пространство один раз, а план доведи потом за столом.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронизируется между iPhone, iPad и Mac"
    platforms: "iOS"

specsTitle: "Требования и результат"
specs:
  - title: "Требования к устройству"
    items:
      - "iPhone с LiDAR (12 Pro и более новые модели Pro)"
      - "iPad Pro 2020 года и новее тоже подходят"
      - "RoomPlan доступен с iOS 16, а последние улучшения выходят на iOS 17 и новее"
  - title: "Что получается на выходе"
    items:
      - "Сцена USDZ с названными объектами"
      - "Стены, двери, окна, проёмы"
      - "Распознанные категории мебели"
      - "Площадь пола и размеры"

