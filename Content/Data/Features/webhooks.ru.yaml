  title: "Вебхуки и автоматизация"
  subtitle: "Пять встроенных сценариев срабатывают в момент, когда считана NFC-метка, QR-код или штрихкод: POST на твой сервер, открытие ссылки, запуск быстрой команды, чтение результата вслух или звуковой сигнал. NFC.cool отвечает за сканирование, а действие остаётся за тобой."
