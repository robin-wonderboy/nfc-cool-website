faqTitle: "Частые вопросы"
faq:
  - question: "Это работает на Android?"
    answer: "Да, вебхуки есть и в версии NFC.cool Tools для iOS, и в версии для Android. Тело JSON на обеих платформах одинаковое. (Остальные четыре сценария, то есть автозапуск быстрой команды, речь, звук и открытие ссылок, доступны только на iOS.)"
  - question: "Сколько адресов можно настроить?"
    answer: "Пока один. На этот адрес приходят все события сканирования, а различать их можно по включённым источникам и по типу содержимого."
  - question: "Какая авторизация поддерживается?"
    answer: "HTTP Basic, то есть логин и пароль, которые хранятся в зашифрованном виде в Keychain на iOS. Токены Bearer, свои заголовки и подпись HMAC пока не поддерживаются."
  - question: "Что будет, если сервер недоступен?"
    answer: "POST завершится ошибкой, а событие останется в журнале на устройстве. Очереди повторных попыток пока нет, поэтому если сервер бывает нестабильным, сделай обработчик идемпотентным и повторяй отправку из истории сканирований."
  - question: "Есть ли ограничение на размер?"
    answer: "Со стороны NFC.cool жёсткого предела нет. Само содержимое метки ограничено стандартом NFC, а это несколько килобайт для обычных меток NDEF."
  - question: "Где посмотреть, как это работает вживую?"
    answer: "Склонируй <a href=\"https://github.com/NickAtGit/nfc-cool-webhook-server\">веб-сервер на GitHub</a>, запусти его локально, направь на него приложение, и каждое сканирование будет прилетать в реальном времени."

