capabilitiesTitle: "Пять сценариев"
capabilities:
  - title: "Вебхук (POST на твой адрес)"
    description: "HTTP POST со структурированным телом JSON сразу после удачного сканирования. Укажи один адрес, при необходимости логин и пароль HTTP Basic, и всё готово. Работает на iOS и Android."
  - title: "Быстрая команда (iOS)"
    description: "Если в считанной ссылке схема `shortcuts://`, нужная быстрая команда запустится сама, без лишнего касания. Данные скана уходят туда, куда дотягиваются «Быстрые команды»."
  - title: "Открытие ссылок (iOS)"
    description: "Если на метке обычная ссылка, она откроется в Safari или в приложении, которому принадлежит. Открывать её вручную уже не нужно."
  - title: "Синтез речи (iOS)"
    description: "Содержимое зачитывается вслух, руки свободны. Скорость речи настраивается. Пригодится для доступности, для работы с занятыми руками или просто как приятное подтверждение."
  - title: "Звук (iOS)"
    description: "Проигрывай звук подтверждения при сканировании: свой файл или один из встроенных сигналов."

subsectionsTitle: "Как работает вебхук"
subsections:
  - title: "Источники: NFC, QR и штрихкоды"
    body: "<p>Вебхуки срабатывают от трёх источников: <strong>сканирование NFC</strong>, <strong>сканирование QR</strong> и <strong>сканирование штрихкодов</strong>. У каждого свой переключатель, поэтому можно гнать чтение NFC в свою складскую систему и не заваливать тот же адрес всем, что видит камера. Сам вебхук при этом один: один адрес, одно тело JSON, один POST.</p>"
    platforms: "iOS · Android"

  - title: "Что уходит в теле запроса"
    body: "<p>Каждый POST отправляет тело JSON такого вида:</p><pre><code>{\n  \"identifier\": \"04:A2:7F:1B:5E:80:00\",\n  \"date\": \"2026-05-12T14:23:01Z\",\n  \"content\": \"Filament Spool #1234\",\n  \"tagType\": \"openPrintTag\",\n  \"structured\": {\n    \"material\": \"PLA\",\n    \"color\": \"#FF6F4C\",\n    \"manufacturer\": \"Prusament\",\n    \"uuid\": \"5e8a-7c1d-4f90\"\n  }\n}</code></pre><p>Поля <code>tagType</code> и <code>structured</code> появляются только у особых форматов вроде <a href=\"/features/nfc-reader-writer/\">OpenPrintTag</a>, а любое другое сканирование отправляет только первые три поля. В <a href=\"/developers/\">справочнике для разработчиков</a> разобрано каждое поле, авторизация, примеры curl и готовые к запуску серверы.</p>"
    platforms: "iOS · Android"

  - title: "Пример сервера на GitHub"
    body: "<p>Быстрее всего увидеть всю цепочку целиком так: <a href=\"https://github.com/NickAtGit/nfc-cool-webhook-server\">веб-сервер на GitHub</a>. Это минимальный пример, который принимает вебхуки NFC.cool, пишет их в лог и показывает структуру вживую. Склонируй, запусти, наведи на него iPhone и смотри, как прилетают сканирования.</p>"
    platforms: "iOS · Android"

specsTitle: "Технические подробности"
specs:
  - title: "Передача"
    items:
      - "Рекомендуется HTTPS, для разработки допустим HTTP"
      - "POST с заголовком `Content-Type: application/json`"
      - "По желанию авторизация HTTP Basic (логин и пароль)"
      - "Учётные данные хранятся в зашифрованном виде в Keychain на iOS"
  - title: "Тело запроса"
    items:
      - "`identifier`, UID метки или считанный код"
      - "`date`, отметка времени в формате ISO 8601"
      - "`content`, разобранное содержимое (ссылка, текст и так далее)"
      - "`tagType`, есть у структурированных меток (например, `openPrintTag`)"
      - "`structured`, вложенный JSON для структурированных типов меток"
  - title: "Источники"
    items:
      - "Сканирование NFC (чтение NDEF)"
      - "Сканирование QR"
      - "Сканирование штрихкодов"
      - "Каждый источник включается отдельно"

