faqTitle: "Часті питання"
faq:
  - question: "Чому це тільки для iOS?"
    answer: "Версія NFC.cool для Android поки зосереджена на NFC і цифровій візитівці. Сканування QR стоїть у планах для Android."
  - question: "Чи прочитають коди зі студії всі сканери?"
    answer: "Так. Це звичайні QR-коди, лише з косметичним оздобленням. Їх розшифрує будь-який стандартний сканер: камера iOS, Google Lens, штатні сканери Android."
  - question: "Чи можна відсканувати QR-код зі знімка екрана?"
    answer: "Так. Вибери будь-яке зображення з галереї, і NFC.cool знайде на ньому всі QR-коди, навіть частково перекриті."
  - question: "Чи додає студія водяний знак або згадку про NFC.cool?"
    answer: "На безкоштовному тарифі код несе невеликий підпис. Коди Platinum ідуть без водяних знаків, тільки твій дизайн."

