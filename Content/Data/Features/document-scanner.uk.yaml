card:
  title: "Сканер документів з розпізнаванням тексту"
  description: "Скануй документи на iPhone чи iPad: краї знаходяться самі, текст розпізнається на пристрої, і нічого нікуди не вивантажується. На виході багатосторінковий PDF, у якому шукається кожне слово."
  imagePath: "/assets/images/Webflow/document-scan.webp"
  platforms: "iOS only"

hero:
  title: "Сканер документів з розпізнаванням тексту"
  subtitle: "Знімай документи з автоматичним пошуком країв і виправленням перспективи. Розпізнавання тексту йде просто на пристрої, тож кожне сканування стає текстом, який нікуди звідти не виходить."
  platforms: "iOS only"
  heroImagePath: "/assets/images/Webflow/document-scan.webp"

capabilitiesTitle: "Що вміє застосунок"
capabilities:
  - title: "Автоматичний пошук країв"
    description: "Наведи камеру на сторінку, і NFC.cool сам знайде кути та зробить знімок. За один сеанс можна відзняти цілу стопку сторінок."
  - title: "Виправлення перспективи"
    description: "Знімок навскіс? NFC.cool розгортає сторінку в рівний прямокутник, прибирає тіні й піднімає контраст, тож результат виглядає як зі справжнього сканера."
  - title: "Розпізнавання тексту на пристрої"
    description: "Текст розпізнається локально на iPhone: ні документ, ні текст не залишають пристрій. Розпізнане зберігається поруч із зображенням, а всередині застосунку його знаходить пошук."
  - title: "Експорт у PDF із текстовим шаром"
    description: "Збери багатосторінковий PDF із вбудованим шаром розпізнаного тексту, щоб кожне слово виділялося, копіювалося й знаходилося в будь-якій програмі для PDF."
  - title: "Швидко поділитися і зберегти"
    description: "Надішли поштою, у Повідомленнях чи через AirDrop або збережи у Файли. Без водяних знаків, без реєстрації, без згадок про NFC.cool."

subsectionsTitle: "Розумніше за знімок екрана"
subsections:
  - title: "Багатосторінкові сканування і готова назва"
    body: "<p>Документи рідко бувають на одну сторінку. NFC.cool тримає камеру відкритою між знімками, дає переставити сторінки місцями, викинути невдалі й зшити все в один документ. Вбудована підказка назв читає першу сторінку й пропонує розумне ім'я файлу, тож перейменовувати вручну щоразу не доведеться.</p>"
    imagePath: "/assets/images/Webflow/document-scan-detail.webp"
    imageAlt: "Детальний перегляд багатосторінкового документа"
    platforms: "iOS"

  - title: "Імпорт із галереї"
    body: "<p>Уже сфотографував чек звичайною камерою? Вибери знімок (або кілька) з галереї: імпортовані фото проходять той самий пошук країв, виправлення перспективи й розпізнавання тексту, що й свіжі знімки. Зручно, щоб заднім числом розібрати місяці розкиданих фотографій.</p>"
    platforms: "iOS"

  - title: "Стиснення під твоїм контролем"
    body: "<p>PDF із телефона легко роздувається, якщо не стежити. У NFC.cool ступінь стиснення винесено в налаштування, тож вибір між архівною якістю й розміром, зручним для пошти, робиться без повторного сканування.</p>"
    platforms: "iOS"

  - title: "Швидкі команди й App Intents"
    body: "<p>NFC.cool вбудовується просто у Швидкі команди iOS і приносить готові дії: взяти останню зчитану NFC-мітку, записати повідомлення на мітку, відкрити сканер або дістати останній відсканований QR-код. Збери з них команду, яка зчитує мітку, розбирає її вміст і запускає далі що завгодно: автоматизацію, журнал, щоденник. Ті самі дії живлять кнопку <strong>Сканувати</strong> на екрані блокування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone зв'язує NFC-мітку з блоками автоматизації"
    platforms: "iOS"

  - title: "Синхронізація через iCloud між iPhone, iPad і Mac"
    body: "<p>Документи самі розходяться через iCloud на всі пристрої твого облікового запису. Відскануй договір на iPhone, перечитай його на iPad, підпиши на <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>: одна бібліотека, жодного експорту туди й назад. Разом із документом їдуть і вихідні знімки, і розпізнаний текст.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронізується між iPhone, iPad і Mac"
    platforms: "iOS"

