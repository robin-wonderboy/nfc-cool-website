faqTitle: "Часті питання"
faq:
  - question: "Чи працює розпізнавання тексту без інтернету?"
    answer: "Так. Vision в iOS розпізнає текст повністю на пристрої. Сканувати й розпізнавати документи вдасться і в літаку, і в лісі, і будь-де."
  - question: "Які мови розпізнає застосунок?"
    answer: "Vision в iOS наразі читає англійську, французьку, італійську, німецьку, іспанську, португальську та спрощену китайську. Окремо підтримується рукописний текст."
  - question: "Наскільки точне розпізнавання?"
    answer: "Для друкованого тексту дуже точне. Для рукописного все залежить від охайності письма й контрасту. Будь-який розпізнаний текст можна поправити після сканування."
  - question: "Де зберігаються відскановані документи?"
    answer: "На безкоштовному тарифі в пісочниці застосунку на самому пристрої. На Platinum їх можна автоматично вивантажувати в Документи iCloud, і тоді їх видно у Файлах і на кожному пристрої з твоїм обліковим записом iCloud."

