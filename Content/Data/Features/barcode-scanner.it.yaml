card:
  title: "Scanner di codici a barre"
  description: "Leggi 13 formati di codici a barre e 6 codici bidimensionali: EAN, UPC, QR, PDF417, Data Matrix e altri ancora. La modalità in serie tiene la fotocamera aperta per gli inventari e per gli ingressi agli eventi."
  imagePath: "/assets/images/Webflow/qr-barcode.webp"
  platforms: "Solo iOS"

hero:
  title: "Scanner di codici a barre"
  subtitle: "Leggi 19 formati: 13 codici a barre lineari (EAN, UPC, Code 128, GS1 DataBar e altri) e 6 codici bidimensionali (QR, PDF417, Aztec, Data Matrix e le varianti Micro). La modalità in serie tiene la fotocamera aperta per gli inventari e per gli ingressi agli eventi."
  platforms: "Solo iOS"
  heroImagePath: "/assets/images/Webflow/qr-barcode.webp"

capabilitiesTitle: "Cosa puoi fare"
capabilities:
  - title: "Tutti i formati principali"
    description: "Leggi EAN-13/8, UPC-E (l'UPC-A viene letto come EAN-13), Code 128, Code 39 (anche con Mod 43), Code 93, ITF, ITF-14, Codabar, GS1 DataBar, PDF417, Aztec, Data Matrix e altri ancora. Il formato viene riconosciuto da solo, senza cambiare modalità."
  - title: "Modalità in serie"
    description: "Leggi una pila di codici uno dopo l'altro senza reinquadrare ogni volta. Comoda per gli inventari, per gli ingressi agli eventi o per gli archivi di una biblioteca."
  - title: "Ricerca del prodotto"
    description: "Tocca il codice a barre di un prodotto appena letto per cercarlo: il numero passa al motore di ricerca che hai impostato (Google, Ecosia, DuckDuckGo, Bing o Startpage) e i risultati arrivano subito."
  - title: "Cronologia e condivisione"
    description: "Ogni scansione viene salvata con data e ora. Metti tra i preferiti quelle che contano, dai a una scansione il titolo che vuoi e condividila direttamente dalla cronologia."
  - title: "Azione automatica alla lettura"
    description: "Gli indirizzi web e i codici dei comandi rapidi possono aprirsi da soli appena letti, far partire un webhook o essere letti ad alta voce: sono gli stessi cinque automatismi che valgono per NFC e QR."

subsectionsTitle: "Pensato per i grandi volumi"
subsections:
  - title: "Scansione multipla, lettura in serie e torcia quando serve"
    body: "<p>Tre impostazioni trasformano lo scanner da una lettura alla volta a un flusso continuo. Con la <strong>scansione multipla</strong> leggi più codici nella stessa sessione della fotocamera. La <strong>lettura in serie</strong> tiene la fotocamera aperta per gli inventari o per gli ingressi agli eventi. La <strong>torcia automatica</strong> accende il LED quando c'è poca luce, così non devi cercare il pulsante della torcia.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone che legge più codici QR e codici a barre con la torcia accesa"
    platforms: "iOS"

  - title: "Webhook per inventari e ingressi agli eventi"
    body: "<p>Collega lo scanner di codici a barre al tuo gestionale. Ogni codice letto fa partire un webhook verso il tuo URL, così il magazzino, il CRM dei partecipanti o il catalogo della biblioteca si aggiornano in tempo reale mentre muovi la fotocamera. Nella pagina <a href=\"/features/webhooks/\">Webhook e automazione</a> trovi la struttura del payload JSON e un server di esempio.</p>"
    platforms: "iOS"

  - title: "Comandi Rapidi e App Intents"
    body: "<p>NFC.cool si aggancia direttamente all'app Comandi Rapidi di iOS con azioni già pronte: recuperare l'ultimo tag NFC letto, scrivere un messaggio su un tag, aprire lo scanner o riprendere l'ultimo codice QR scansionato. Concatenale in un comando che legge un tag, ne interpreta il contenuto e avvia quello che vuoi: un'automazione, un registro, un diario, quello che ti serve. Le stesse azioni alimentano il controllo <strong>Pulsante di scansione</strong> nella schermata di blocco su iOS 17 e versioni successive.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone che collega un tag NFC a blocchi di automazione"
    platforms: "iOS"

  - title: "Sincronizzazione iCloud tra iPhone, iPad e Mac"
    body: "<p>La cronologia delle scansioni si sincronizza su tutti i dispositivi collegati al tuo account iCloud. Leggi uno scaffale di prodotti con l'iPhone, controlla l'elenco sull'iPad, dai un titolo alle scansioni e condividile dal <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>: una cronologia sola, senza spostare niente a mano.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool che si sincronizza tra iPhone, iPad e Mac"
    platforms: "iOS"

specsTitle: "Formati supportati (19 in tutto)"
specs:
  - title: "Codici a barre lineari (13 formati)"
    items:
      - "EAN-13, EAN-8"
      - "UPC-E (l'UPC-A viene letto come EAN-13)"
      - "Code 39, Code 39 Mod 43"
      - "Code 93, Code 128"
      - "Codabar"
      - "Interleaved 2 of 5, ITF-14"
      - "GS1 DataBar (standard, Expanded, Limited)"
  - title: "Codici 2D e impilati (6 formati)"
    items:
      - "QR Code"
      - "Micro QR"
      - "PDF417"
      - "Micro PDF417"
      - "Aztec"
      - "Data Matrix"

