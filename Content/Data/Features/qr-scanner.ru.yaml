card:
  title: "Сканер QR-кодов и студия"
  description: "Сканируй QR-коды с камеры или находи их на любом снимке, а свои собирай с иконками и Genmoji во встроенной студии QR-кодов."
  imagePath: "/assets/images/Webflow/qr-studio.webp"
  platforms: "Только iOS"

hero:
  title: "Сканер QR-кодов и студия"
  subtitle: "Сканируй любой QR-код с камеры или найди его на скриншоте. Собирай свои коды с логотипом, Genmoji и фирменными цветами во встроенной студии QR-кодов."
  platforms: "Только iOS"
  heroImagePath: "/assets/images/Webflow/qr-studio.webp"

capabilitiesTitle: "Что можно делать"
capabilities:
  - title: "Сканировать любые QR-коды"
    description: "Ссылки, vCard, данные Wi-Fi, события календаря, платежи, ссылки в магазины приложений: NFC.cool определяет тип содержимого и предлагает нужное действие."
  - title: "Находить QR-коды на скриншотах"
    description: "Выбери любую картинку из галереи, и NFC.cool найдёт и расшифрует все QR-коды на ней, даже частично перекрытые или малоконтрастные."
  - title: "Собирать коды в студии"
    description: "Свои цвета, скруглённые глазки, необычная форма пикселей и логотип или Genmoji в центре. Экспорт в PNG вплоть до 4096×4096."
  - title: "Хранить историю и делиться снова"
    description: "Каждое сканирование сохраняется локально: открой содержимое заново, скопируй, поделись или сразу вернись к действию."
  - title: "Запускать действие при считывании"
    description: "Открыть ссылку, запустить быструю команду, отправить вебхук или зачитать результат вслух сразу после сканирования: те же пять сценариев, что и у NFC."

subsectionsTitle: "Больше, чем сканер"
subsections:
  - title: "Виджеты: твой QR-код на экране «Домой»"
    body: "<p>Вынеси самые нужные QR-коды на экран «Домой» iPhone или iPad с помощью <strong>виджета с изображением QR</strong>. Wi-Fi для офиса, ссылка на визитку, меню твоего бара: всё на виду, и это сканируется с чужого телефона, пока ты вообще ничего не открываешь. <strong>Виджет последнего скана</strong> показывает недавно считанный код, чтобы отправить его снова одним движением. А <strong>виджет кнопки сканирования</strong> запускает сканер прямо с экрана «Домой» или с экрана блокировки, одним касанием, в iOS 17 и новее через интерактивные элементы.</p>"
    imagePath: "/assets/images/Features/qr-scanner-widgets-home-screen.webp"
    imageAlt: "Экран «Домой» на iPhone с виджетами QR-кодов и кнопкой сканирования"
    platforms: "iOS"

  - title: "Студия QR-кодов: форма пикселей, цвета, глазки, логотипы"
    body: "<p>Студия QR-кодов помогает сохранить читаемость и при этом уйти от корпоративной квадратной эстетики. Выбирай форму пикселей (скруглённые, точки, ромбы), стиль каждого глазка, цвет символов и фона, логотип или Genmoji в центре. Экспорт доступен в шести размерах: 512, 1024, 1536, 2048, 3072 и 4096 пикселей.</p>"
    imagePath: "/assets/images/Features/qr-scanner-studio-card.webp"
    imageAlt: "Студия QR-кодов со своим логотипом"
    platforms: "iOS"

  - title: "Мультискан, пакетное чтение и фонарик по требованию"
    body: "<p>Три настройки превращают сканер из разового в непрерывный. <strong>Мультискан</strong> позволяет считать несколько кодов за один сеанс камеры. <strong>Пакетное чтение</strong> держит камеру открытой для инвентаризации и регистрации гостей. <strong>Автофонарик</strong> включает вспышку в темноте, чтобы не искать кнопку фонарика на ощупь.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone сканирует несколько QR-кодов и штрихкодов при свете фонарика"
    platforms: "iOS"

  - title: "Быстрые команды и App Intents"
    body: "<p>NFC.cool встраивается прямо в приложение «Быстрые команды» готовыми действиями: взять последнюю считанную NFC-метку, записать сообщение на метку, открыть сканер или взять последний считанный QR-код. Из них собираются сценарии, которые считывают метку, разбирают её содержимое и запускают что угодно дальше: автоматизацию, журнал, дневник, всё что придумаешь. Те же действия питают элемент <strong>«Кнопка сканирования»</strong> на экране блокировки в iOS 17 и новее.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone связывает NFC-метку с блоками автоматизации"
    platforms: "iOS"

  - title: "Синхронизация с iCloud между iPhone, iPad и Mac"
    body: "<p>История сканирований и твои макеты из студии QR синхронизируются между всеми устройствами с одной учётной записью iCloud. Собери код на iPad, отправь его с iPhone, поправь на <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>: одна библиотека, одни и те же правки, без экспорта туда-обратно.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронизируется между iPhone, iPad и Mac"
    platforms: "iOS"

