faqTitle: "Domande frequenti"
faq:
  - question: "Devo sbloccare l'iPhone per leggere un tag?"
    answer: "Nella maggior parte dei casi no: dall'iPhone XS in poi i tag NDEF si leggono in background dalla schermata di blocco, senza aprire nessuna app. Su Android, invece, per leggere un tag l'app deve essere in primo piano."
  - question: "Posso leggere un tag senza connessione a internet?"
    answer: "Sì. La lettura e la scrittura NFC avvengono interamente sul dispositivo. NFC.cool non invia mai il contenuto dei tag a nessun server."
  - question: "Scrivere un tag NFC è rischioso?"
    answer: "No, ed è un'operazione reversibile: un tag si può riscrivere tutte le volte che vuoi. Usa il blocco solo quando sei davvero sicuro, perché un tag bloccato in modo permanente non è più riscrivibile."
  - question: "Quanto è sicuro NFC Safe?"
    answer: "NFC Safe cifra i contenuti con AES-256-GCM e ricava la chiave dalla tua passphrase con PBKDF2-HMAC-SHA256 su 100.000 iterazioni, con un salt casuale di 16 byte e un nonce di 12 byte per ogni record. Senza la passphrase, quello che si trova sul tag è indistinguibile da una sequenza di byte casuali."
  - question: "Lo stesso tag di NFC Safe funziona sia su iOS sia su Android?"
    answer: "Sì, il formato è interoperabile. Cifra su una piattaforma e decifra sull'altra: stessa passphrase, stesso contenuto."
  - question: "Azzerare una testina Sonicare comporta qualche rischio?"
    answer: "L'operazione azzera il contatore d'uso scritto sul tag, così il manico smette di assillarti. La testina in sé non sa di essere stata azzerata, continua semplicemente a lavare. Sta a te valutare quando le setole vanno sostituite."

