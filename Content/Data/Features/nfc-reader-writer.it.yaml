  subtitle: "Leggi e scrivi tag NFC su iPhone e Android. Avvicina il telefono per leggere qualsiasi tag, scrivi i tuoi con link, contatti e reti Wi-Fi, poi bloccali così nessun altro potrà modificarli."
  platforms: "iOS · Android"
