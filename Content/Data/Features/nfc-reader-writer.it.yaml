  description: "Leggi qualsiasi tag NFC e scrivi oltre 25 tipi di messaggio: link, reti Wi-Fi, biglietti da visita, comandi rapidi e altro ancora. Blocca i tag e cifra i dati riservati con NFC Safe."
  imagePath: "/assets/images/Webflow/nfc-card.webp"
