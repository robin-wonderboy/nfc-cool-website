faqTitle: "Domande frequenti"
faq:
  - question: "Funziona anche su Android?"
    answer: "Sì, i webhook ci sono sia nella versione iOS sia in quella Android di NFC.cool Tools e il payload JSON ha la stessa struttura su entrambe le piattaforme. Gli altri quattro automatismi (avvio del Comando rapido, sintesi vocale, audio e apertura dei link) sono invece solo per iOS."
  - question: "Quanti URL posso configurare?"
    answer: "Per ora uno soltanto. Lo stesso indirizzo riceve tutti gli eventi di scansione, distinti dalle sorgenti che hai attivato e dal tipo di contenuto."
  - question: "Quale autenticazione è supportata?"
    answer: "L'autenticazione HTTP Basic, con nome utente e password salvati cifrati nel Portachiavi di iOS. Al momento non sono supportati i token Bearer, le intestazioni personalizzate e la firma HMAC."
  - question: "Cosa succede se il mio server non risponde?"
    answer: "La POST fallisce e l'evento resta registrato sul dispositivo. Per ora non c'è una coda di reinvio automatico: se il server può risultare instabile, scrivi un gestore idempotente, che regga senza effetti collaterali un secondo invio identico, e rilancia la chiamata dalla cronologia delle scansioni."
  - question: "C'è un limite alla dimensione del payload?"
    answer: "NFC.cool non ne impone nessuno. Sono i contenuti dei tag a essere limitati dallo standard NFC: qualche KB per i tag NDEF più comuni."
  - question: "Dove posso vederlo all'opera?"
    answer: "Clona il <a href=\"https://github.com/NickAtGit/nfc-cool-webhook-server\">Server web su GitHub</a>, avvialo in locale, imposta l'app su quell'indirizzo e vedrai arrivare ogni scansione in tempo reale."

