card:
  title: "Сканер штрихкодов"
  description: "Сканируй 13 форматов штрихкодов и ещё 6 двумерных кодов: EAN, UPC, QR, PDF417, Data Matrix и другие. Пакетный режим держит камеру открытой для инвентаризации и регистрации гостей."
  imagePath: "/assets/images/Webflow/qr-barcode.webp"
  platforms: "Только iOS"

hero:
  title: "Сканер штрихкодов"
  subtitle: "19 форматов кодов: 13 линейных штрихкодов (EAN, UPC, Code 128, GS1 DataBar и другие) и 6 двумерных (QR, PDF417, Aztec, Data Matrix и версии Micro). Пакетный режим держит камеру открытой для инвентаризации и регистрации гостей."
  platforms: "Только iOS"
  heroImagePath: "/assets/images/Webflow/qr-barcode.webp"

capabilitiesTitle: "Что можно делать"
capabilities:
  - title: "Читать все основные форматы"
    description: "EAN-13 и EAN-8, UPC-E (UPC-A читается как EAN-13), Code 128, Code 39 вместе с Mod 43, Code 93, ITF, ITF-14, Codabar, GS1 DataBar, PDF417, Aztec, Data Matrix и другие. Формат определяется сам, режимы переключать не надо."
  - title: "Работать пакетом"
    description: "Считывай стопку штрихкодов подряд, не наводя камеру заново. Пригодится на инвентаризации, регистрации гостей и в библиотечном архиве."
  - title: "Искать товар по коду"
    description: "Нажми на считанный товарный штрихкод, и его номер уйдёт в заранее выбранный поисковик (Google, Ecosia, DuckDuckGo, Bing или Startpage), а подходящие результаты вернутся сразу."
  - title: "Хранить историю и делиться"
    description: "Каждое сканирование сохраняется с отметкой времени. Отмечай нужное избранным, давай сканам свои названия и отправляй их прямо из истории."
  - title: "Запускать действие при считывании"
    description: "Ссылки и служебные коды могут открываться сразу после сканирования, отправлять вебхук или зачитываться вслух: те же пять сценариев, что у NFC и QR."

subsectionsTitle: "Сделано для больших объёмов"
subsections:
  - title: "Мультискан, пакетное чтение и фонарик по требованию"
    body: "<p>Три настройки превращают сканер из разового в непрерывный. <strong>Мультискан</strong> позволяет считать несколько кодов за один сеанс камеры. <strong>Пакетное чтение</strong> держит камеру открытой для инвентаризации и регистрации гостей. <strong>Автофонарик</strong> включает вспышку в темноте, чтобы не искать кнопку фонарика на ощупь.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone сканирует несколько QR-кодов и штрихкодов при свете фонарика"
    platforms: "iOS"

  - title: "Вебхуки для инвентаризации и регистрации гостей"
    body: "<p>Направь сканер штрихкодов в свою учётную систему. Каждое считывание отправляет вебхук на твой адрес, и база склада, CRM с участниками или библиотечный каталог обновляются в реальном времени, пока камера идёт по полке. Форма JSON и пример сервера описаны на странице <a href=\"/features/webhooks/\">«Вебхуки и автоматизация»</a>.</p>"
    platforms: "iOS"

  - title: "Быстрые команды и App Intents"
    body: "<p>NFC.cool встраивается прямо в приложение «Быстрые команды» готовыми действиями: взять последнюю считанную NFC-метку, записать сообщение на метку, открыть сканер или взять последний считанный QR-код. Из них собираются сценарии, которые считывают метку, разбирают её содержимое и запускают что угодно дальше: автоматизацию, журнал, дневник, всё что придумаешь. Те же действия питают элемент <strong>«Кнопка сканирования»</strong> на экране блокировки в iOS 17 и новее.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone связывает NFC-метку с блоками автоматизации"
    platforms: "iOS"

  - title: "Синхронизация с iCloud между iPhone, iPad и Mac"
    body: "<p>История сканирования штрихкодов синхронизируется между всеми устройствами с одной учётной записью iCloud. Пройди с iPhone по полке с товарами, посмотри список на iPad, дай сканам названия и отправь их с <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>: одна общая история, ничего не надо переносить руками.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронизируется между iPhone, iPad и Mac"
    platforms: "iOS"

specsTitle: "Поддерживаемые форматы (всего 19)"
specs:
  - title: "Линейные штрихкоды (13 форматов)"
    items:
      - "EAN-13, EAN-8"
      - "UPC-E (UPC-A читается как EAN-13)"
      - "Code 39, Code 39 Mod 43"
      - "Code 93, Code 128"
      - "Codabar"
      - "Interleaved 2 of 5, ITF-14"
      - "GS1 DataBar (обычный, Expanded, Limited)"
  - title: "Двумерные и составные коды (6 форматов)"
    items:
      - "QR Code"
      - "Micro QR"
      - "PDF417"
      - "Micro PDF417"
      - "Aztec"
      - "Data Matrix"

