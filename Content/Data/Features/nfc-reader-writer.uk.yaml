  title: "Читання і запис NFC"
  description: "Зчитуй будь-яку NFC-мітку. На власну лягає будь-що з понад 25 типів записів: посилання, Wi-Fi, візитівки, Швидкі команди та інше. Блокуй мітки й шифруй секрети в NFC Safe."
  imagePath: "/assets/images/Webflow/nfc-card.webp"
  platforms: "iOS · Android"

hero:
  title: "Читання і запис NFC"
  subtitle: "Читай і записуй NFC-мітки на iPhone та Android. Піднеси телефон, щоб зчитати будь-яку мітку, запиши власну з посиланням, контактом чи паролем від Wi-Fi, а потім заблокуй її, щоб вміст ніхто не змінив."
  platforms: "iOS · Android"
