faqTitle: "Часті питання"
faq:
  - question: "Чи треба розблоковувати iPhone, щоб зчитати мітку?"
    answer: "Здебільшого ні: iPhone XS і новіші читають мітки NDEF просто з екрана блокування, у фоні, і застосунок відкривати не треба. На Android для читання застосунок має бути відкритий."
  - question: "Чи потрібен інтернет, щоб зчитати мітку?"
    answer: "Ні. Читання і запис NFC відбуваються повністю на пристрої. NFC.cool ніколи не надсилає вміст мітки на жоден сервер."
  - question: "Чи безпечно записувати NFC-мітки?"
    answer: "Запис безпечний і за замовчуванням оборотний: перезаписувати мітку можна скільки завгодно разів. Блокування вмикай тільки тоді, коли впевнений, бо заблоковану назавжди мітку перезаписати вже не вийде."
  - question: "Наскільки надійний NFC Safe?"
    answer: "NFC Safe шифрує вміст алгоритмом AES-256-GCM, а ключ виводить з парольної фрази через PBKDF2-HMAC-SHA256 за 100 000 ітерацій, з випадковою сіллю на 16 байтів і 12-байтовим одноразовим числом для кожного запису. Без парольної фрази вміст мітки не відрізнити від випадкових байтів."
  - question: "Чи відкриється мітка NFC Safe і на iOS, і на Android?"
    answer: "Так, формат сумісний в обидва боки. Зашифруй на одній платформі, розшифруй на іншій: та сама парольна фраза, той самий вміст."
  - question: "Чи не зіпсує щось скидання насадки Sonicare?"
    answer: "Скидається лічильник використання на самій мітці, тож ручка перестає нагадувати про заміну. Насадка про це нічого не знає й далі чистить зуби. Коли щетинкам справді час на спокій, вирішуй сам."

