capabilitiesTitle: "Що вміє застосунок"
capabilities:
  - title: "Читання будь-якої мітки NDEF"
    description: "Піднеси телефон до мітки й розглянь її записи NDEF: посилання, контакти, звичайний текст, дані MIME, запуск застосунків, власні формати, а поруч сирі байти й тип чипа."
  - title: "Понад 25 типів записів"
    description: "Сайти, номери телефонів, vCard, паролі Wi-Fi, PayPal, Cash App і Venmo, Spotify, YouTube, Швидкі команди, Instagram, X, LinkedIn, TikTok, WhatsApp та інше."
  - title: "Блокування і захист паролем"
    description: "Зроби мітку назавжди доступною лише для читання або постав на неї пароль, щоб читати й перезаписувати могли тільки дозволені пристрої. Захист мітки промислового рівня."
  - title: "Форматування, пакетний запис, копіювання"
    description: "Форматуй чисті мітки, записуй один вміст одразу на цілий стос міток для заходу чи запуску продукту й переноси вміст однієї мітки на іншу."
  - title: "Автодії після зчитування"
    description: "Після дотику мітка сама запускає Швидку команду iOS, озвучує результат, надсилає вебхук або відкриває посилання. П'ять автодій, один дотик."

subsectionsTitle: "Глибше, ніж звичайний NFC-застосунок"
subsections:
  - title: "NFC Safe: шифрування секретів просто на мітці"
    body: "<p>Більшість NFC-застосунків поводяться з міткою, як з листівкою: прочитати її може будь-хто з телефоном. NFC Safe перетворює її на запечатаний конверт. Секрет (пароль, фраза відновлення, ліцензійний ключ чи будь-який текст) шифрується на пристрої алгоритмом AES-256 ще до того, як потрапить на мітку. Мітку легко загубити, її можуть украсти, її можна віддати незнайомцю: без парольної фрази вміст лишається просто шумом.</p><p>Шифрування однакове на обох платформах, тож секрет закривається на iPhone, а відкривається на Android. Цікаво, як саме все влаштовано? <a href=\"/blog/nfc-safe-encrypted-secrets/\">У блозі є докладний розбір NFC Safe</a>.</p>"
    imagePath: "/assets/images/Blog/nfc-safe-encrypted-secrets.webp"
    imageAlt: "Зашифрований секрет NFC Safe на мітці"
    platforms: "iOS · Android"

  - title: "Лічильник дотиків: кожна мітка зі своїм ID і кількістю зчитувань"
    body: "<p>Деякі чипи NFC рахують власні зчитування апаратно. Лічильник дотиків це використовує: мітка налаштовується так, щоб із кожним зчитуванням дописувати до свого вмісту (посилання, адреси пошти, SMS чи Швидкої команди) поточну кількість дотиків, а за потреби й власний унікальний ID. Ні сервера, ні інтернету, ні бекенду: чип рахує і підставляє значення сам.</p><p>Так одна мітка розповідає, яку саме наліпку піднесли до телефона і скільки разів, і на цьому вже будується сценарій: віддати перші 100 зчитувань під демо, стежити за відгуком на візитівці або підтвердити оригінальність лічильником, який тільки зростає. Потрібен повний розбір? <a href=\"/blog/count-nfc-tag-scans/\">У блозі є посібник про лічильник дотиків</a>, а на <a href=\"/tap-counter/\">живому прикладі</a> все видно одразу: піднеси мітку й дивись, як число на сторінці росте.</p>"
    imagePath: "/assets/images/Blog/count-nfc-tag-scans.webp"
    imageAlt: "Телефон біля NFC-мітки, лічильник зчитувань росте"
    platforms: "iOS · Android"

  - title: "OpenPrintTag: філамент для 3D-принтера прямо на котушці"
    body: "<p>OpenPrintTag задає відкритий стандарт для метаданих котушки з філаментом (матеріал, колір, виробник, UUID, залишок довжини) у невеликому записі NDEF з кодуванням CBOR. NFC.cool читає і записує цей формат напряму на обох платформах, тож сумісний принтер упізнає котушку тієї ж миті, коли її встановлюють. Формат новий для тебе? <a href=\"/blog/openprinttag-read-write-nfc-spools-phone/\">У блозі є посібник, як читати й записувати котушки OpenPrintTag</a>.</p><p>Той самий формат наповнює структуровані дані вебхуків зі сторінки <a href=\"/features/webhooks/\">Вебхуки й автоматизація</a>: щойно принтер отримує свіжу котушку, на твій сервер летить POST.</p>"
    imagePath: "/assets/images/Blog/openprinttag-read-write-nfc-spools-phone.webp"
    imageAlt: "Читання і запис котушок OpenPrintTag з телефона"
    platforms: "iOS · Android"

  - title: "Скидання лічильника на насадці зубної щітки"
    body: "<p>У насадках щіток Philips Sonicare стоїть NFC-мітка, яка рахує використання, щоб ручка нагадувала про заміну. NFC.cool уміє скинути цей лічильник: зчитує стан мітки, проводить через скидання й записує новий стан. Однаково на обох платформах. Хочеш знати, що саме рахує чип? <a href=\"/blog/reset-sonicare-brush-head-nfc/\">У блозі є посібник про насадки Sonicare</a>. (Насадок я не роблю, лише дарую твоїй ще місяць гідного життя.)</p>"
    imagePath: "/assets/images/Blog/reset-sonicare-brush-head-nfc.webp"
    imageAlt: "Скидання насадки Philips Sonicare через NFC"
    platforms: "iOS · Android"

  - title: "Режим для досвідчених"
    body: "<p>Для тих, кому цікаво, що насправді лежить на чипі: NFC.cool вивантажує всю пам'ять мітки у шістнадцятковому вигляді, визначає модель чипа (NTAG213/215/216, NTAG424 DNA, MIFARE Classic/Ultralight, варіанти ISO 15693, FeliCa тощо) і показує загальний обсяг, доступні користувачеві байти, сторінки блокування та контейнери можливостей. Зроблено для розробників, мейкерів і всіх, хто розбирається з норовливою міткою.</p><p>На iOS <strong>експертний режим APDU</strong> опускається ще на рівень нижче: надсилай на мітку сирі команди ISO 7816 і читай відповіді. Саме те, що треба, коли підключаєшся до незвичного зчитувача чи власного протоколу або просто хочеш почути від чипа всю правду.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-power-user-mode.webp"
    imageAlt: "iPhone показує пам'ять NFC-мітки на діагностичних панелях"
    platforms: "iOS · Android"

  - title: "Криптовалюта одним дотиком"
    body: "<p>Запиши адресу Bitcoin, Ethereum, Solana, Lightning чи будь-якого іншого гаманця як запис NDEF з платіжним URI. Один дотик, і статична адреса вже в співрозмовника на конференції; та сама адреса їде в наліпці на твоєму товарі або назавжди лишається на металевій картці. Читання працює так само: піднеси телефон до криптомітки, і застосунок гаманця відкриється одразу на потрібному екрані.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-cryptocurrency-tap.webp"
    imageAlt: "iPhone передає адресу криптогаманця через NFC-мітку"
    platforms: "iOS · Android"

  - title: "Підключення до Wi-Fi без набирання пароля"
    body: "<p>Запиши на мітку назву мережі, тип захисту й пароль один раз. Далі кожен, хто піднесе телефон, потрапляє в мережу: не треба ні диктувати пароль, ні клеїти папірець на холодильник в орендованій квартирі. Працює і навпаки: зчитай чужу мітку з Wi-Fi у гостях, і система сама запропонує приєднатися.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-wifi-onboarding.webp"
    imageAlt: "iPhone підключається до Wi-Fi з NFC-мітки"
    platforms: "iOS · Android"

  - title: "Озвучення вголос"
    body: "<p>Для доступності, для роботи із зайнятими руками або просто тому, що так приємніше: увімкни синтез мовлення, і вміст кожної мітки звучатиме вголос одразу після дотику. Швидкість мовлення налаштовується, а VoiceOver та інші допоміжні технології працюють паралельно.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-speak-aloud.webp"
    imageAlt: "iPhone озвучує NFC-мітку, поруч звукові хвилі"
    platforms: "iOS"

  - title: "Пакетний запис із CSV"
    body: "<p>Склади список у Numbers, Excel чи Google Таблицях, збережи його як файл CSV і відкрий цей файл на телефоні. Кожен рядок стає окремою міткою, а якщо стовпців кілька, кожна комірка стає окремим записом на цій мітці. NFC.cool сам визначає роздільник, показує попередній перегляд із кількістю байтів на мітку й записує мітки одну за одною, поки ти підносиш їх до телефона. Записані рядки зникають з файлу, тож роботу можна спинити й продовжити будь-коли. <a href=\"/blog/batch-write-nfc-tags-csv/\">Повний розбір, від таблиці до останньої мітки</a>.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-csv-batch-write.webp"
    imageAlt: "iPhone записує стос NFC-міток з таблиці"
    platforms: "iOS · Android"

  - title: "Швидкі команди й App Intents"
    body: "<p>NFC.cool вбудовується просто у Швидкі команди iOS і приносить готові дії: взяти останню зчитану NFC-мітку, записати повідомлення на мітку, відкрити сканер або дістати останній відсканований QR-код. Збери з них команду, яка зчитує мітку, розбирає її вміст і запускає далі що завгодно: автоматизацію, журнал, щоденник. Ті самі дії живлять кнопку <strong>Сканувати</strong> на екрані блокування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone зв'язує NFC-мітку з блоками автоматизації"
    platforms: "iOS"

  - title: "Синхронізація через iCloud між iPhone, iPad і Mac"
    body: "<p>Історія зчитувань, записи NFC Safe і шаблони для запису самі опиняються на кожному пристрої з тим самим обліковим записом iCloud. Піднесеш мітку до iPhone у кишені, і за мить зчитування вже в бібліотеці на iPad. NFC.cool тепер <a href=\"/blog/nfc-cool-comes-to-mac/\">працює і на Mac з Apple Silicon</a>, тож та сама бібліотека відкривається й там.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронізується між iPhone, iPad і Mac"
    platforms: "iOS"

specsTitle: "Підтримані мітки й технології"
specs:
  - title: "Родини міток"
    items:
      - "NFC Forum Type 1, 2, 3, 4, 5"
      - "NTAG 213, 215, 216, 424 DNA, варіанти NTAG I²C"
      - "MIFARE Classic 1K/4K, MIFARE Ultralight, MIFARE DESFire"
      - "ISO 14443 A/B, ISO 15693, FeliCa (iOS)"
  - title: "Типи записів"
    items:
      - "URI (веб, mailto, tel, sms, geo, власні схеми)"
      - "Текст (з позначкою мови)"
      - "vCard і контакти"
      - "Дані Wi-Fi, парування Bluetooth"
      - "Smart Poster (складений запис)"
      - "Запуск застосунку"
      - "Адреса криптовалюти (на основі URI)"
      - "OpenPrintTag (метадані філаменту для 3D-принтера)"
      - "NFC Safe (зашифрований зовнішній тип, urn:nfc:ext:crypto)"
      - "MIME, зовнішні типи, сирі байти"
  - title: "Особливості платформ"
    items:
      - "iOS 16 і новіші (фонове читання міток з екрана блокування на iPhone XS і новіших)"
      - "Android 8.0 і новіші (API 26), читання NFC у відкритому застосунку"
      - "Для запису з iOS потрібні дозволи Core NFC, і вони вже є в застосунку"
      - "Фонове читання NFC на Android вимагає, щоб застосунок був відкритий"

