faqTitle: "Sık sorulanlar"
faq:
  - question: "LiDAR şart mı?"
    answer: "Evet. RoomPlan, Apple'ın yalnızca LiDAR ile çalışan bir arayüzü. (3B Nesne Tarayıcı da LiDAR ister: Apple'ın Object Capture oturumu bunu denetler.)"
  - question: "Bir tarama ne kadar sürer?"
    answer: "Odanın içinde dolaşman yeterli. Sonuç anlık üretilir ve sen turu bitirdiğinde hazırdır."
  - question: "Sonucu CAD yazılımında açabilir miyim?"
    answer: "Evet, USDZ'yi modern CAD ve 3B araçların çoğu destekliyor. SketchUp ya da Revit akışları için Blender veya ücretsiz bir USD'den OBJ'ye çevirici kullan."

