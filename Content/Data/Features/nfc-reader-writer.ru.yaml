capabilitiesTitle: "Что можно делать"
capabilities:
  - title: "Читать любую метку NDEF"
    description: "Поднеси телефон к любой NFC-метке и разбери её записи NDEF: ссылки, контакты, обычный текст, данные MIME, запуск приложений, свои форматы. Плюс сырые байты и тип чипа."
  - title: "Записывать больше 25 типов данных"
    description: "Сайты, номера телефонов, vCard, данные Wi-Fi, PayPal, Cash App и Venmo, Spotify, YouTube, быстрые команды, Instagram, X, LinkedIn, TikTok, WhatsApp и другое."
  - title: "Блокировать и ставить пароль"
    description: "Сделай метку навсегда доступной только для чтения или закрой её паролем, чтобы читать и писать могли лишь доверенные устройства. Защита промышленного уровня."
  - title: "Форматировать, писать пачкой, копировать"
    description: "Форматируй пустые метки, записывай одно и то же сразу на стопку меток для мероприятия или запуска продукта и копируй содержимое одной метки на другую."
  - title: "Запускать действия при считывании"
    description: "По касанию метка может запустить быструю команду iOS, зачитать результат вслух, отправить вебхук или сама открыть ссылку. Пять сценариев на одно касание."

subsectionsTitle: "Глубже, чем обычное NFC-приложение"
subsections:
  - title: "NFC Safe: шифрование секретов прямо на метке"
    body: "<p>Большинство NFC-приложений обращается с меткой как с открыткой: прочитать её может любой, у кого есть телефон. NFC Safe превращает её в запечатанный конверт. Секрет (пароль, seed-фраза, лицензионный ключ или любой текст) шифруется на твоём устройстве алгоритмом AES-256 ещё до того, как попадёт на метку. Метку можно потерять, её могут украсть, её можно отдать незнакомцу: без парольной фразы там только шум.</p><p>Шифрование одинаково работает на обеих платформах, поэтому секрет можно закрыть на iPhone, а открыть на Android. Хочешь разобраться, как именно всё зашифровано? <a href=\"/blog/nfc-safe-encrypted-secrets/\">Читай подробный разбор NFC Safe в блоге</a>.</p>"
    imagePath: "/assets/images/Blog/nfc-safe-encrypted-secrets.webp"
    imageAlt: "Зашифрованный секрет NFC Safe на метке"
    platforms: "iOS · Android"

  - title: "Счётчик касаний: каждая метка со своим ID и числом считываний"
    body: "<p>Некоторые NFC-чипы считают свои сканирования аппаратно. Счётчик касаний это использует: метка настраивается так, чтобы при каждом считывании дописывать текущее число касаний, а при желании и свой уникальный ID, к тому, что на ней уже записано (ссылке, адресу почты, SMS или быстрой команде). Ни сервера, ни интернета, ни бэкенда: чип считает и подставляет всё сам.</p><p>Так одна метка расскажет, какую именно наклейку поднесли и сколько раз, и на это можно реагировать: открыть демо только для первых ста сканирований, отследить интерес к визитке или подтвердить подлинность счётчиком, который умеет только расти. Нужен полный разбор? <a href=\"/blog/count-nfc-tag-scans/\">Читай руководство по счётчику касаний в блоге</a> или <a href=\"/tap-counter/\">попробуй живой пример</a>: поднеси метку и смотри, как растёт число на странице.</p>"
    imagePath: "/assets/images/Blog/count-nfc-tag-scans.webp"
    imageAlt: "Телефон считывает NFC-метку, число сканирований растёт"
    platforms: "iOS · Android"

  - title: "OpenPrintTag: данные о филаменте прямо на катушке"
    body: "<p>OpenPrintTag задаёт открытый стандарт для хранения данных о катушке филамента (материал, цвет, производитель, UUID, остаток длины) в небольшой записи NDEF в формате CBOR. NFC.cool читает и пишет этот формат на обеих платформах, поэтому совместимый принтер узнаёт катушку сразу после загрузки. Не сталкивался с форматом раньше? <a href=\"/blog/openprinttag-read-write-nfc-spools-phone/\">В блоге есть руководство по чтению и записи катушек OpenPrintTag</a>.</p><p>Тот же формат лежит в основе структурированных вебхуков со страницы <a href=\"/features/webhooks/\">«Вебхуки и автоматизация»</a>: POST-запрос уходит на твою ферму принтеров сразу, как только обнаружена свежая катушка.</p>"
    imagePath: "/assets/images/Blog/openprinttag-read-write-nfc-spools-phone.webp"
    imageAlt: "Чтение и запись катушек OpenPrintTag с телефона"
    platforms: "iOS · Android"

  - title: "Сброс насадки зубной щётки"
    body: "<p>В насадках Philips Sonicare стоит NFC-метка, которая считает износ, чтобы ручка напоминала о замене. NFC.cool умеет сбрасывать этот счётчик: считывает состояние метки, проводит по шагам сброса и записывает новое состояние. На обеих платформах одинаково. Интересно, что именно считает чип? <a href=\"/blog/reset-sonicare-brush-head-nfc/\">Читай разбор насадок Sonicare в блоге</a>. (Насадки мы не делаем, просто даём твоей ещё месяц достойной жизни.)</p>"
    imagePath: "/assets/images/Blog/reset-sonicare-brush-head-nfc.webp"
    imageAlt: "Сброс насадки Philips Sonicare через NFC"
    platforms: "iOS · Android"

  - title: "Режим для продвинутых"
    body: "<p>Для тех, кому важно знать, что на чипе на самом деле: NFC.cool выгружает всю память метки в hex, определяет модель чипа (NTAG213/215/216, NTAG424 DNA, MIFARE Classic и Ultralight, варианты ISO 15693, FeliCa и другие) и показывает общий объём, пользовательские байты, страницы блокировки и контейнеры возможностей. Сделано для разработчиков, мейкеров и всех, кто отлаживает метку.</p><p>На iOS <strong>режим экспертных APDU</strong> идёт ещё глубже: можно отправлять на метку сырые команды ISO 7816 и смотреть ответы. Пригодится, когда работаешь с необычным считывателем, со своим протоколом или просто хочешь узнать, в чём чип сознается.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-power-user-mode.webp"
    imageAlt: "iPhone показывает память NFC-метки в диагностических панелях"
    platforms: "iOS · Android"

  - title: "Криптовалюта по касанию"
    body: "<p>Запиши адрес Bitcoin, Ethereum, Solana, Lightning или любого другого кошелька как запись NDEF с платёжной ссылкой. Одно касание, и статичный кошелёк передан на конференции, вклеен наклейкой в продукт или лежит на металлической карточке с постоянным адресом. Чтение работает так же: считай крипто-метку, и приложение кошелька откроется сразу на нужном экране.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-cryptocurrency-tap.webp"
    imageAlt: "iPhone передаёт криптокошелёк через NFC-метку"
    platforms: "iOS · Android"

  - title: "Подключение к Wi-Fi без ввода пароля"
    body: "<p>Один раз запиши на метку имя сети, тип защиты и пароль. Дальше любой, кто поднесёт телефон, попадёт в сеть: не надо диктовать пароль по буквам и оставлять записку на холодильнике в съёмной квартире. Работает и наоборот: считай Wi-Fi-метку в чужом доме, и система сама предложит подключиться.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-wifi-onboarding.webp"
    imageAlt: "iPhone подключается к Wi-Fi по NFC-метке"
    platforms: "iOS · Android"

  - title: "Чтение вслух"
    body: "<p>Для доступности, для работы без рук или просто потому что так приятнее: включи синтез речи, и содержимое метки будет зачитываться вслух сразу после касания. Скорость речи настраивается, а работает всё параллельно с VoiceOver и другими вспомогательными технологиями.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-speak-aloud.webp"
    imageAlt: "iPhone зачитывает NFC-метку вслух, вокруг звуковые волны"
    platforms: "iOS"

  - title: "Пакетная запись из CSV"
    body: "<p>Собери список в Numbers, Excel или Google Таблицах, выгрузи его в файл CSV и открой этот файл на телефоне. Каждая строка станет отдельной меткой, а если колонок несколько, каждая ячейка станет отдельной записью на этой метке. NFC.cool сам определит разделитель, покажет предпросмотр с числом байт на метку и запишет метки одну за другой, пока ты подносишь их к телефону. Записанные строки удаляются из файла, так что остановиться и продолжить можно в любой момент. <a href=\"/blog/batch-write-nfc-tags-csv/\">Читай полный разбор, от таблицы до последней метки</a>.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-csv-batch-write.webp"
    imageAlt: "iPhone пакетно записывает NFC-метки из таблицы"
    platforms: "iOS · Android"

  - title: "Быстрые команды и App Intents"
    body: "<p>NFC.cool встраивается прямо в приложение «Быстрые команды» готовыми действиями: взять последнюю считанную NFC-метку, записать сообщение на метку, открыть сканер или взять последний считанный QR-код. Из них собираются сценарии, которые считывают метку, разбирают её содержимое и запускают что угодно дальше: автоматизацию, журнал, дневник, всё что придумаешь. Те же действия питают элемент <strong>«Кнопка сканирования»</strong> на экране блокировки в iOS 17 и новее.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone связывает NFC-метку с блоками автоматизации"
    platforms: "iOS"

  - title: "Синхронизация с iCloud между iPhone, iPad и Mac"
    body: "<p>История сканирований, записи NFC Safe и шаблоны для записи синхронизируются между всеми устройствами, где выполнен вход в одну учётную запись iCloud. Поднеси метку к iPhone в кармане, и через мгновение скан появится в библиотеке на iPad. NFC.cool теперь <a href=\"/blog/nfc-cool-comes-to-mac/\">работает и на Mac с Apple Silicon</a>, так что та же библиотека будет и там.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронизируется между iPhone, iPad и Mac"
    platforms: "iOS"

specsTitle: "Поддерживаемые метки и технологии"
specs:
  - title: "Семейства меток"
    items:
      - "NFC Forum, типы 1, 2, 3, 4, 5"
      - "NTAG 213, 215, 216, 424 DNA, варианты NTAG I²C"
      - "MIFARE Classic 1K/4K, MIFARE Ultralight, MIFARE DESFire"
      - "ISO 14443 A/B, ISO 15693, FeliCa (iOS)"
  - title: "Типы записей"
    items:
      - "URI (веб, mailto, tel, sms, geo, свои схемы)"
      - "Текст (с указанием языка)"
      - "vCard и контакты"
      - "Данные Wi-Fi, сопряжение Bluetooth"
      - "Smart Poster (составная запись)"
      - "Запуск приложения"
      - "Адрес криптокошелька (на основе URI)"
      - "OpenPrintTag (данные о филаменте для 3D-печати)"
      - "NFC Safe (зашифрованный внешний тип, urn:nfc:ext:crypto)"
      - "MIME, внешние типы, сырые байты"
  - title: "Особенности платформ"
    items:
      - "iOS 16 и новее (фоновое чтение меток с экрана блокировки на iPhone XS и новее)"
      - "Android 8.0 и новее (API 26), чтение NFC в активном приложении"
      - "Запись с iOS требует прав Core NFC, и они уже встроены в приложение"
      - "Фоновое чтение NFC на Android требует, чтобы приложение было открыто"

