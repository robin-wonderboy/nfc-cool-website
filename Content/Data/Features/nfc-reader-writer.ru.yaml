faqTitle: "Частые вопросы"
faq:
  - question: "Нужно ли разблокировать iPhone, чтобы считать метку?"
    answer: "Чаще всего нет: iPhone XS и новее читают метки NDEF с экрана блокировки в фоне, запускать приложение не надо. На Android приложение должно быть открыто."
  - question: "Можно ли считать метку без интернета?"
    answer: "Да. Чтение и запись происходят полностью на устройстве. NFC.cool никогда не выгружает содержимое метки на сервер."
  - question: "Запись NFC-меток безопасна?"
    answer: "Запись безопасна и по умолчанию обратима: перезаписывать метку можно сколько угодно раз. Блокировку включай только наверняка: заблокированную навсегда метку переписать уже нельзя."
  - question: "Насколько надёжен NFC Safe?"
    answer: "NFC Safe шифрует содержимое алгоритмом AES-256-GCM, а ключ выводит из парольной фразы через PBKDF2-HMAC-SHA256 за 100 000 итераций, со случайной 16-байтовой солью и 12-байтовым значением nonce на каждую запись. Без парольной фразы содержимое метки неотличимо от случайных байтов."
  - question: "Одна и та же метка NFC Safe работает на iOS и Android?"
    answer: "Да, формат совместим. Зашифруй на одной платформе, расшифруй на другой: та же парольная фраза, то же содержимое."
  - question: "Сброс насадки Sonicare чему-нибудь навредит?"
    answer: "Сброс обнуляет счётчик износа на метке, чтобы ручка перестала напоминать о замене. Сама насадка о сбросе ничего не знает и просто продолжает чистить. Когда менять щетину, решай сам."

