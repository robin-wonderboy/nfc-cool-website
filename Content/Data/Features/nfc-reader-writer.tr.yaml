      - "ISO 14443 A/B, ISO 15693, FeliCa (iOS)"
  - title: "Kayıt türleri"
    items:
      - "URI (web, mailto, tel, sms, geo, özel şemalar)"
      - "Metin (dil etiketli)"
      - "vCard / kişi"
      - "Wi-Fi bilgileri, Bluetooth eşleştirme"
      - "Smart Poster (bileşik)"
      - "Uygulama açma"
      - "Kripto para adresi (URI tabanlı)"
      - "OpenPrintTag (3B yazıcı filament bilgileri)"
      - "NFC Safe (şifreli harici tür, urn:nfc:ext:crypto)"
      - "MIME, harici tür, ham baytlar"
  - title: "Platform notları"
    items:
      - "iOS 16 ve üzeri (iPhone XS ve sonrasında kilit ekranından arka planda tag okuma)"
      - "Android 8.0 ve üzeri (API 26), ön planda NFC okuma"
      - "iOS'tan tag yazmak Core NFC yetkileri ister, bunlar uygulamada hazır gelir"
      - "Android'de arka planda NFC okuma için uygulamanın ön planda olması gerekir"

