faqTitle: "Sık sorulanlar"
faq:
  - question: "Tag okumak için iPhone'umun kilidi açık olmalı mı?"
    answer: "Okumaların çoğunda hayır: iPhone XS ve sonrası NDEF tag'leri kilit ekranından, arka planda okur, uygulamayı açmaya gerek kalmaz. Android'de ise tag okumak için uygulamanın ön planda olması gerekir."
  - question: "İnternet olmadan tag okuyabilir miyim?"
    answer: "Evet. NFC okuma ve yazma tamamen cihazda olur. NFC.cool tag içeriğini hiçbir sunucuya yüklemez."
  - question: "NFC tag yazmak güvenli mi?"
    answer: "Yazma varsayılan olarak güvenli ve geri alınabilir: bir tag'i istediğin kadar yeniden yazabilirsin. Kilitleme özelliğini yalnızca emin olduğunda kullan, çünkü kalıcı olarak kilitlenen tag bir daha yazılamaz."
  - question: "NFC Safe ne kadar güvenli?"
    answer: "NFC Safe içerikleri AES-256-GCM ile şifreler; anahtarı parolandan PBKDF2-HMAC-SHA256 ile, 100.000 yineleme, 16 baytlık rastgele tuz ve kayıt başına 12 baytlık nonce kullanarak türetir. Parola olmadan tag'deki içerik rastgele baytlardan ayırt edilemez."
  - question: "Aynı NFC Safe tag'i hem iOS'ta hem Android'de çalışır mı?"
    answer: "Evet. Biçim iki platformda ortak. Birinde şifrele, diğerinde çöz: aynı parola, aynı içerik."
  - question: "Sonicare fırça başlığını sıfırlamak bir şeyi geçersiz kılar mı?"
    answer: "Tag üzerindeki kullanım sayacını sıfırlar, sap da seni rahat bırakır. Fırça başlığının kendisi sıfırlandığından haberdar olmaz, fırçalamayı sürdürür. Kılların ne zaman değişmesi gerektiğine kendin karar ver."

