  description: "Обійди предмет із телефоном, і Object Capture від Apple збере текстуровану 3D-модель. Експортуй у USDZ для доповненої реальності, у STL для 3D-друку або в OBJ для Blender. Потрібен iPhone Pro чи iPad Pro з LiDAR."
  imagePath: "/assets/images/Webflow/3d-object.webp"
