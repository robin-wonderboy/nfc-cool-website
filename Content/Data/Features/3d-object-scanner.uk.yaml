hero:
  title: "3D-сканер об'єктів"
  subtitle: "Обійди справжній предмет з iPhone у руках, і NFC.cool збере текстуровану 3D-модель через Object Capture від Apple просто на пристрої. Готову модель забирай у доповнену реальність або в будь-який 3D-редактор."
  platforms: "iOS only"
