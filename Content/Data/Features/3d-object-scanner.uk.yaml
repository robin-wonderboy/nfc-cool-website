faqTitle: "Часті питання"
faq:
  - question: "Чи потрібен на iPhone LiDAR?"
    answer: "Так. Сеанс Object Capture від Apple вимагає пристрою з LiDAR, тобто iPhone Pro (12 Pro і новіші) або iPad Pro від 2020 року. У звичайних iPhone LiDAR немає."
  - question: "Скільки триває сканування?"
    answer: "Кілька хвилин ходьби навколо предмета, а потім ще пара хвилин збирання моделі на пристрої. Більші й фактурніші предмети забирають більше часу."
  - question: "Чи можна надрукувати результат на 3D-принтері?"
    answer: "Експортуй в OBJ і переведи його в STL у Blender, MeshLab чи будь-якому іншому 3D-інструменті. Найкраще виходять предмети середнього розміру з виразною фактурою."
  - question: "Чим це відрізняється від сканера приміщень?"
    answer: "Object Capture, тобто ця функція, будує одну 3D-модель предмета. Сканер приміщень бере LiDAR і RoomPlan від Apple та будує план простору: стіни, двері, меблі. LiDAR потрібен обом, але відповідають вони на різні питання."

