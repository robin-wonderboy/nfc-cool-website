capabilitiesTitle: "Що вміє застосунок"
capabilities:
  - title: "Зйомка для фотограметрії"
    description: "Обійди предмет, роблячи десятки знімків. Фотограметрія Object Capture просто на пристрої збирає текстуровану 3D-модель з правдоподібною геометрією."
  - title: "Перегляд і доопрацювання"
    description: "Роздивись модель у 3D ще до експорту. За бажання відкрий вихідні знімки сеансу, щоб побачити те саме, що бачила камера."
  - title: "AR Quick Look"
    description: "Постав відсканований предмет собі у вітальню через AR Quick Look. Файлом USDZ можна поділитися з друзями, і вони роздивляться його прямо в Повідомленнях."
  - title: "Шість форматів експорту"
    description: "Забирай текстурований USDZ для AR Quick Look або чисту геометрію в USD, OBJ, STL, PLY чи ABC для Blender та решти 3D-інструментів."

subsectionsTitle: "З твоїх рук у доповнену реальність"
subsections:
  - title: "AR Quick Look у Повідомленнях"
    body: "<p>Для доповненої реальності Apple має власний формат USDZ. Поділися відсканованим предметом в iMessage чи через AirDrop, і одержувач покрутить його, поставить у себе в кімнаті й зробить знімок екрана просто з попереднього перегляду повідомлення, нічого не встановлюючи. Чудово для показу товару, документування скульптури або просто щоб похвалитися.</p>"
    platforms: "iOS"

  - title: "Швидкі команди й App Intents"
    body: "<p>NFC.cool вбудовується просто у Швидкі команди iOS і приносить готові дії: взяти останню зчитану NFC-мітку, записати повідомлення на мітку, відкрити сканер або дістати останній відсканований QR-код. Збери з них команду, яка зчитує мітку, розбирає її вміст і запускає далі що завгодно: автоматизацію, журнал, щоденник. Ті самі дії живлять кнопку <strong>Сканувати</strong> на екрані блокування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone зв'язує NFC-мітку з блоками автоматизації"
    platforms: "iOS"

  - title: "Синхронізація через iCloud між iPhone, iPad і Mac"
    body: "<p>Відскановані моделі лежать у теці «Документи» в iCloud, тож iPhone, яким ти знімав, iPad, на якому переглядав, і <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>, на якому редагуватимеш, бачать одну бібліотеку. Зніми в дорозі, доведи до ладу за столом.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронізується між iPhone, iPad і Mac"
    platforms: "iOS"

