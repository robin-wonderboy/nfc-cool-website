faqTitle: "Частые вопросы"
faq:
  - question: "Нужен ли iPhone с LiDAR?"
    answer: "Да. Сеанс Object Capture у Apple работает только на устройстве с LiDAR, то есть на iPhone Pro (12 Pro и новее) или на iPad Pro начиная с 2020 года. В обычных iPhone датчика LiDAR нет."
  - question: "Сколько длится сканирование?"
    answer: "Несколько минут ходьбы вокруг предмета и ещё пара минут на сборку модели прямо на устройстве. Крупные и более фактурные предметы занимают больше времени."
  - question: "Модель можно напечатать на 3D-принтере?"
    answer: "Выгрузи её в OBJ и переведи в STL в Blender, MeshLab или любом стандартном 3D-редакторе. Точность получается лучше всего на предметах среднего размера с хорошей фактурой."
  - question: "Чем это отличается от сканера помещений?"
    answer: "Object Capture, то есть эта функция, собирает одну 3D-модель предмета. Сканер помещений через LiDAR и RoomPlan от Apple строит план пространства: стены, двери, мебель. LiDAR нужен обоим, но отвечают они на разные вопросы."

