capabilitiesTitle: "Что можно делать"
capabilities:
  - title: "Снимать фотограмметрией"
    description: "Обойди предмет, сделав несколько десятков снимков. Object Capture от Apple прямо на устройстве соберёт текстурированную 3D-модель с достоверной геометрией."
  - title: "Смотреть и дорабатывать"
    description: "Покрути модель в 3D перед выгрузкой. При желании загляни в исходные снимки сеанса и посмотри, что именно увидела камера."
  - title: "Открывать в AR Quick Look"
    description: "Поставь отсканированный предмет к себе в гостиную через AR Quick Look. Файлами USDZ можно делиться с друзьями: они откроются прямо в «Сообщениях»."
  - title: "Выгружать в шесть форматов"
    description: "Текстурированный USDZ для AR Quick Look или чистая геометрия в USD, OBJ, STL, PLY и ABC для Blender и остальной 3D-цепочки."

subsectionsTitle: "От предмета в руках до дополненной реальности"
subsections:
  - title: "AR Quick Look прямо в «Сообщениях»"
    body: "<p>USDZ служит у Apple родным форматом дополненной реальности. Отправь отсканированный предмет в iMessage или по AirDrop, и получатель сможет покрутить его, поставить в своё пространство и сделать скриншот, прямо из предпросмотра сообщения, без установки приложений. Отлично подходит для показа товара, документирования скульптуры или просто чтобы похвастаться.</p>"
    platforms: "iOS"

  - title: "Быстрые команды и App Intents"
    body: "<p>NFC.cool встраивается прямо в приложение «Быстрые команды» готовыми действиями: взять последнюю считанную NFC-метку, записать сообщение на метку, открыть сканер или взять последний считанный QR-код. Из них собираются сценарии, которые считывают метку, разбирают её содержимое и запускают что угодно дальше: автоматизацию, журнал, дневник, всё что придумаешь. Те же действия питают элемент <strong>«Кнопка сканирования»</strong> на экране блокировки в iOS 17 и новее.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone связывает NFC-метку с блоками автоматизации"
    platforms: "iOS"

  - title: "Синхронизация с iCloud между iPhone, iPad и Mac"
    body: "<p>Отсканированные модели лежат в папке «Документы» в iCloud, поэтому iPhone, которым ты снимал, iPad, на котором смотрел, и <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>, на котором будешь править, видят одну и ту же библиотеку. Снимай на ходу, доводи за столом.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронизируется между iPhone, iPad и Mac"
    platforms: "iOS"

